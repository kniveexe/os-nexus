,"Compute each process’s metrics, then sum and divide by the number of processes. Retain units consistently.","For ordinary textbook examples assume one CPU, known bursts, stated arrivals and zero context-switch overhead unless the question explicitly changes those assumptions."],"example":{"question":"P arrives at t=2, first runs at t=5, consumes one 4-unit CPU burst, and finishes at t=11 after preemption. Find response, turnaround and waiting.","answer":"Response: $$RT=5-2=3.$$ Turnaround: $$TT=11-2=9.$$ Waiting: $$WT=9-4=5.$$ All values use the same time unit. The five waiting units can occur in several Ready intervals. No I/O is assumed."},"misconceptions":["Waiting time is not always first-start minus arrival in a preemptive schedule.","Turnaround is completion minus arrival, not completion alone.","Response time is not total completion time."],"recall":"A CPU is busy for 8 units during a 10-unit interval. What is utilization, and why must idle time stay in the denominator?","recallAnswer":"80%. Utilization describes the whole observation interval; removing idle time would hide underuse.","relatedPa":[],"refs":[{"source":"scheduling","locator":"Slides 13–16: performance measures and process-state timing"},{"source":"theo5","locator":"Where the Three Times Come From"}],"scopeStatus":"core"},{"id":"fcfs-sjf","group":"Scheduling","topic":"FCFS, SJF and burst prediction","title":"Arrival order versus shortest available burst","minutes":16,"intro":"A long job at the front of a queue can make many short jobs wait. Choosing shorter available work can improve average waiting, but requires knowledge or prediction of burst length.","why":"Both FCFS and non-preemptive SJF keep the current burst once selected. SJF chooses among processes that have already arrived, not future jobs.","definition":"FCFS executes ready jobs in arrival order. Non-preemptive SJF selects the available job with the shortest next CPU burst whenever the CPU becomes free.","steps":["For FCFS, order arrivals and specify a tie-break such as listed order. Execute each selected burst to completion in a simple single-burst problem.","The convoy effect occurs when short jobs wait behind a long CPU burst, delaying their progress and potentially the devices they would use.","For SJF, choose the shortest burst from the ready set at each dispatch. Do not interrupt the current job merely because a shorter one later arrives.","For jobs all available at time zero with known bursts and zero overhead, shortest-first order minimizes average waiting. That claim needs these assumptions; it is not a universal guarantee for arbitrary online arrivals.","The source asks how a future burst can be estimated. Exponential averaging uses next estimate τ(n+1)=α·t(n)+(1−α)·τ(n), where 0≤α≤1 and t(n) is the most recent measured burst.","A larger α gives more weight to recent behavior; a smaller α preserves more history. Predictions can be wrong, and long jobs can suffer under a continuing supply of short work."],"example":{"question":"All arrive at 0: P1=24, P2=3, P3=3. Compare FCFS listed order with SJF using P2 before P3.","answer":"FCFS: P1 0–24, P2 24–27, P3 27–30; waiting 0,24,27; average 17. SJF: P2 0–3, P3 3–6, P1 6–30; waiting by process 6,0,3; average 3. Turnaround averages are 27 and 13 respectively."},"misconceptions":["SJF cannot choose a process that has not arrived.","Non-preemptive SJF is not shortest-remaining-time scheduling.","The textbook optimum assumes known bursts and an appropriate availability model."],"recall":"With previous estimate 10, actual burst 6 and α=0.5, what is the next estimate?","recallAnswer":"0.5×6 + 0.5×10 = 8 time units.","relatedPa":[],"refs":[{"source":"scheduling","locator":"Slides 17–22: FCFS, SJF examples and exponential-average estimation task"},{"source":"theo5","locator":"Exercises 5-1 and 5-2; additional examples"}],"scopeStatus":"core"},{"id":"srt","group":"Scheduling","topic":"Shortest remaining time scheduling","title":"Reconsider the remaining work at each arrival","minutes":16,"intro":"SRT can interrupt a long burst to run a newly arrived shorter one. After interruption, compare remaining time, not the original burst length.","why":"This is a high-error topic because each new arrival changes the ready set and a previously running process retains partially completed work.","definition":"Shortest remaining time (SRT/SRTF) is the preemptive form of SJF: the ready process with the least remaining CPU burst is selected.","steps":["Start at the first arrival. Among ready processes, select the shortest remaining burst; specify a tie-break such as keeping the current process on equality.","Advance to the next relevant event: the running process completes or a new process arrives. Subtract elapsed execution from its remaining time.","At an arrival, compare the newcomer’s burst with the remaining times already in the ready set. Preempt only if the rule selects another process.","On completion, record C and select again. Continue until every job completes, showing idle gaps if the ready set is empty.","Compute turnaround C−A, waiting C−A−B, and first-response S−A separately. A process that starts immediately can still accumulate substantial waiting after preemption.","SRT favors short remaining work and can delay long jobs under continual short arrivals. Its calculations assume known/estimated future CPU burst lengths."],"example":{"question":"Use the source example: P1(A=0,B=8), P2(1,4), P3(2,9), P4(3,5). Give the timeline and average waiting.","answer":"P1 0–1; P2 1–5; P4 5–10; P1 10–17; P3 17–26. Completions: 17,5,26,10. Waiting: 9,0,15,2; average 6.5. Turnaround: 17,4,24,7; average 13. First responses: 0,0,15,2."},"misconceptions":["When P1 resumes, use its remaining burst, not its original burst.","A new arrival does not force preemption unless it wins the policy comparison.","First response can be zero while total waiting is large."],"recall":"If a process has 7 units remaining and a 4-unit job arrives under SRT, what happens?","recallAnswer":"The 4-unit job is selected and the 7-unit process returns to Ready, assuming no other job has even less remaining time.","relatedPa":[],"refs":[{"source":"scheduling","locator":"Slide 23: SRT example and preemptive SJF"},{"source":"theo5","locator":"Exercise 5-5; additional examples"}],"scopeStatus":"core"},{"id":"priority-scheduling","group":"Scheduling","topic":"Priority scheduling and aging","title":"A ranking needs a direction and a tie-break","minutes":13,"intro":"Priority scheduling orders work by importance rather than only arrival or burst length. A numeric value is meaningless until you know whether smaller or larger means higher priority.","why":"The source uses lower number = higher priority. Equal-priority behavior must be stated; do not infer an unannounced tie-break from a partly specified example.","definition":"Priority scheduling selects the highest-priority ready process. It may be non-preemptive or preemptive. Aging gradually improves the priority of waiting work to reduce starvation.","steps":["State the priority convention. In the lecture examples, priority 1 outranks priority 3.","Non-preemptive priority selects the best ready priority only when the current burst ends or blocks. Later higher-priority arrival waits until then.","Preemptive priority can interrupt the current process when a strictly higher-priority process becomes ready.","Specify the equal-priority rule, for example FCFS with no preemption on equality. Different tie rules can produce different valid timelines for the same numeric table.","Low-priority work may wait indefinitely if higher-priority work keeps arriving. Aging increases waiting work’s effective priority to limit this risk.","The lecture’s preemptive-priority example does not make every equal-priority tie rule explicit. For reproducible answers, show your assumption and do not silently assume shorter-job ordering."],"example":{"question":"P1 arrives 0, burst 5, priority 2; P2 arrives 2, burst 1, priority 1. Use preemptive priority, lower number higher, zero overhead.","answer":"P1 runs 0–2; P2 runs 2–3; P1 resumes 3–6. Waiting: P1=6−0−5=1, P2=3−2−1=0. Under non-preemptive priority, P1 would run 0–5 before P2."},"misconceptions":["A larger numeric value is not automatically higher priority.","Equal priority does not define a tie-break by itself.","Aging addresses starvation risk; it is not the same as changing every process’s base workload."],"recall":"Why can priority scheduling starve a process?","recallAnswer":"A continuous supply of higher-priority ready work can keep the low-priority process from ever being selected.","relatedPa":[],"refs":[{"source":"scheduling","locator":"Slides 24–25: non-preemptive/preemptive priority; slide 31: aging"},{"source":"theo5","locator":"Exercises 5-3 and 5-6; additional examples"}],"scopeStatus":"core"},{"id":"round-robin","group":"Scheduling","topic":"Round Robin and time quantum","title":"Give each ready process a turn","minutes":14,"intro":"A long burst need not monopolize an interactive system. Round Robin limits a turn and returns unfinished work to the queue so other ready processes can run.","why":"Queue order and remaining burst determine the Gantt chart. A time quantum is a maximum turn, not an instruction to waste time after a process finishes.","definition":"Round Robin schedules a ready queue in cyclic order, giving each selected process up to a time quantum q before preemption if it still has work.","steps":["Take the head of the ready queue. Run it for min(q, remaining burst), unless the model includes a blocking event that ends the burst sooner.","If it finishes, record completion and do not requeue it. If it remains runnable after q, append it to the queue tail.","Add newly arriving processes according to the stated arrival policy. At exactly simultaneous arrival/quantum boundaries, specify event order if it affects the result.","A very large q approaches FCFS behavior. A very small q improves turn-taking but increases switching frequency and overhead.","With n continuously ready processes and no overhead/new arrivals, a process waits at most (n−1)q between turns. This simplified bound is not universal for dynamic queues and nonzero overhead.","Use separate response and waiting calculations. Round Robin often improves initial responsiveness while average turnaround may be worse than SJF."],"example":{"question":"All arrive 0: P1=24, P2=3, P3=3; q=4, order P1,P2,P3, zero overhead.","answer":"P1 0–4; P2 4–7; P3 7–10; P1 10–14,14–18,18–22,22–26,26–30. Completions are 30,7,10. Waiting is 6,4,7 (average 5.67); response is 0,4,7 (average 3.67); turnaround averages 15.67."},"misconceptions":["A process with 2 units remaining uses only 2 units even if q=4.","After the other jobs finish, consecutive quanta of the same process need not imply useful switches to another process.","The lecture’s timing ranges are illustrative, not a universal OS specification."],"recall":"What is the main cost of choosing q extremely small relative to switch time?","recallAnswer":"A large fraction of elapsed time is spent switching rather than advancing application work.","relatedPa":[],"refs":[{"source":"scheduling","locator":"Slides 26–27: Round Robin and q=4 example"},{"source":"theo5","locator":"Exercise 5-4; additional examples"}],"scopeStatus":"core"},{"id":"multilevel-queues","group":"Scheduling","topic":"Multilevel and feedback queues","title":"Different classes can use different policies","minutes":11,"intro":"Interactive work and long background jobs have different needs. A scheduler can organize ready work into several classes instead of forcing one policy on every task.","why":"You must distinguish scheduling inside a queue from scheduling between queues, and fixed queue membership from feedback-based movement.","definition":"Multilevel queue scheduling partitions work into queues with separate policies. Multilevel feedback queues additionally permit migration between queues based on defined rules.","steps":["A fixed multilevel design assigns each process to a queue, such as foreground interactive or background batch work.","Each queue has an internal algorithm: for example foreground Round Robin and background FCFS.","A between-queue policy decides which queue receives CPU time. Strict queue priority can starve lower queues; allocating a time share to each queue provides a different trade-off.","Feedback queues move processes based on behavior or waiting. A process that consumes its full time slice may be demoted; aging or periodic boosts can promote waiting work.","The source example has Q0 with q=8, Q1 with q=16 and Q2 using FCFS. To calculate an exact timeline, admission, promotion, demotion and between-queue rules must also be specified.","Changing queues is the defining distinction of feedback, not simply having several queues with different names.","Theo MLFQ example: Q0 has an 8 ms quantum, Q1 has 16 ms, and Q2 uses FCFS. An isolated 30 ms job consumes 8 ms, then 16 ms, then the remaining 6 ms in Q2. Assume no competing work or overhead.","A strict-priority interactive queue can starve a background queue. Reserving a positive CPU share for each queue prevents complete queue-level exclusion under the stated policy; it does not guarantee every individual deadline."],"example":{"question":"A scheduler gives foreground RR 80% of CPU time and background FCFS 20%. Is this the same as strict foreground priority?","answer":"No. The time-share policy reserves a portion for background work; strict foreground priority can leave background work with no service while foreground remains ready."},"misconceptions":["Several queues do not automatically make a feedback scheduler.","Knowing only the quantum of each queue is insufficient for a unique MLFQ timeline.","Aging must be defined as a rule, not merely named."],"recall":"What extra rules must an MLFQ design specify beyond per-queue algorithms?","recallAnswer":"Initial placement, when to promote or demote, and how the CPU is allocated between queues; also tie and arrival handling for exact calculations.","relatedPa":[],"refs":[{"source":"scheduling","locator":"Slides 28–31: multilevel queue and multilevel feedback queue"},{"source":"theo5","locator":"Exercises 5-7 and 5-8"}],"scopeStatus":"core"},{"id":"multicore-realtime","group":"Scheduling","topic":"Multiprocessor scheduling and real-time latency","title":"Balance the machine without losing locality or deadlines","minutes":14,"intro":"With several cores, “which process next?” becomes “which process on which core?” For real-time work, finishing after a deadline may be unacceptable even if average throughput is high.","why":"The scheduling PDF includes both multiprocessor and real-time sections, so its coverage extends beyond the six classic single-CPU algorithms.","definition":"Multiprocessor scheduling distributes work across processors. Real-time scheduling considers timing constraints; hard real-time tasks require deadlines to be met, while soft real-time favors timely service without that guarantee.","steps":["Asymmetric multiprocessing assigns central system decisions to a designated processor in the source model. Symmetric multiprocessing lets processors participate in scheduling and execution.","Load balancing seeks to avoid an idle core while another is overloaded. Push migration moves work from a busy processor; pull migration lets an idle processor take waiting work.","Processor affinity preserves locality by keeping work near cached data. Soft affinity is a preference; hard affinity restricts execution to an allowed processor set.","Balancing and affinity can conflict: migration may use an idle core but lose useful cache locality. NUMA and heterogeneous processors add memory-access and capability considerations.","A memory stall means execution waits for data. Hardware multithreading or scheduling other ready work may improve resource use, but ordinary OS switches are not the only mechanism.","Interrupt latency runs from an interrupt event to the start of its handler. Dispatch latency covers moving CPU control to the selected task. Both affect event response.","For hard real-time behavior, average speed is insufficient: worst-case timing, scheduling policy and workload feasibility matter. The source’s soft real-time definition prioritizes critical work without guaranteeing its deadline.","SMP may use a common ready queue, requiring synchronization so two cores do not dispatch the same task, or per-core ready queues, which favor locality but need balancing.","Theo latency example: interrupt at 10 ms, ISR starts at 12, task ready at 15, task starts at 18. Interrupt delay is 2 ms, ISR execution is 3 ms, and ready-to-start delay is 3 ms. Total is 8 ms, not 5. In general, ready-to-start may also include scheduler waiting; the exercise treats that entire final interval as dispatch latency."],"example":{"question":"A task is pinned to core 0 while core 1 is idle. Why might it still wait?","answer":"Hard affinity can prohibit execution on core 1. Relaxing affinity may improve balance, but migration can lose cache locality. If the task has a deadline, the timing effect must be assessed rather than assuming an idle core fixes it."},"misconceptions":["More cores do not eliminate scheduling policy.","Processor affinity is not the same as a permanent private CPU.","High priority alone does not prove a hard deadline will be met."],"recall":"What is the difference between interrupt latency and dispatch latency?","recallAnswer":"Interrupt latency is delay until interrupt handling starts; dispatch latency is the handoff delay to the task selected for execution.","relatedPa":[],"refs":[{"source":"scheduling","locator":"Slides 32–40: multicore, AMP/SMP, affinity, balancing and real-time latency"},{"source":"theo5","locator":"Exercises 5-9 to 5-12"}],"scopeStatus":"core"},{"id":"race-producer-consumer","group":"Concurrency","topic":"Race conditions and bounded producer-consumer","title":"A single increment can contain several steps","minutes":14,"intro":"Two pieces of code can each be correct in isolation and still produce a wrong result when their operations interleave over shared data.","why":"The lecture’s counter example shows why a source-code statement such as counter++ is not necessarily atomic. You must reason about loads, computation and stores.","definition":"A race condition occurs when a result depends on uncontrolled timing/interleaving of concurrent access. A bounded producer-consumer buffer has finite capacity, so producers wait when full and consumers wait when empty.","steps":["Represent a circular buffer with in and out positions. Advance each modulo N so the indices wrap. A count can record the number of occupied slots.","A producer creates data, waits for space, writes a slot and updates bookkeeping. A consumer waits for data, reads a slot and updates bookkeeping.","A typical increment is load counter into a register, add one, store it back. A decrement similarly loads, subtracts and stores. The operations can be interleaved.","Starting at count=5, producer and consumer can both read 5. The producer computes 6; the consumer computes 4. If stores occur 6 then 4, the final count is 4 instead of the correct net 5.","Reversing those final stores can leave 6. Both results lose one update. Executing each entire update with suitable synchronization preserves the intended net result.","Single-core preemption is enough to create this problem; multiple cores are not required. Atomicity, ordering and shared access must be designed explicitly."],"example":{"question":"Starting counter=5, P reads 5 and computes 6; C reads 5 and computes 4; C stores 4; P stores 6. What is final value and correct net value?","answer":"The final stored value is 6, but one increment and one decrement should net to 5. The final producer store overwrites the consumer’s update."},"misconceptions":["One source-code line is not necessarily one atomic machine operation.","Concurrency on one CPU can still cause races.","Checking “not full” or “not empty” alone does not protect shared bookkeeping."],"recall":"Why is counter++ unsafe when unsynchronized concurrent code also modifies counter?","recallAnswer":"Its read/modify/write steps can interleave with another update, so one final store may overwrite an update based on an earlier value.","relatedPa":[],"refs":[{"source":"concurrency","locator":"Slides 11–24: concurrent inconsistency, bounded buffer and counter interleavings"}],"scopeStatus":"core"},{"id":"critical-section","group":"Concurrency","topic":"Critical sections and correctness requirements","title":"Exclusion alone is not enough","minutes":12,"intro":"A door that never opens prevents two people entering together, but it is not a useful access policy. Correct synchronization must allow progress as well as prevent conflicts.","why":"The three critical-section requirements test different failure modes. Explain each separately rather than treating “no race” as a complete answer.","definition":"A critical section accesses shared state that must be protected against conflicting concurrent access. A correct solution aims for mutual exclusion, progress and bounded waiting under its stated assumptions.","steps":["The entry section obtains permission; the critical section performs protected work; the exit section releases permission; the remainder section performs unrelated work.","Mutual exclusion means at most one participant executes the protected critical section for the shared resource at a time.","Progress means that if the critical section is free and participants want to enter, the decision about the next entrant cannot be postponed indefinitely by unrelated/nonparticipating work.","Bounded waiting limits how many other entries can occur after a participant requests entry before it is admitted. It addresses indefinite postponement.","Strict alternation using only turn can ensure exclusion but violate progress: a process may have to wait for the other’s turn even when the other does not want to enter.","These properties require assumptions about atomic operations, memory ordering and execution opportunities. A synchronization algorithm cannot make a permanently unscheduled process execute by itself."],"example":{"question":"Only P0 wants the critical section, but turn=P1 and P1 stays in its remainder section. Which requirement does strict alternation violate?","answer":"Progress. The section is free and P0 wants to enter, yet P1’s nonparticipation prevents P0’s admission. Mutual exclusion may still hold."},"misconceptions":["Mutual exclusion does not automatically imply bounded waiting.","A busy wait is not proof that progress is impossible; correctness depends on the protocol.","Unrelated critical sections for independent resources need not all share one global lock."],"recall":"How does bounded waiting differ from mutual exclusion?","recallAnswer":"Mutual exclusion prevents simultaneous protected entry; bounded waiting limits how many others can go first after a request, preventing indefinite bypass under the model.","relatedPa":[],"refs":[{"source":"concurrency","locator":"Slides 25–30: critical sections, requirements and strict alternation"}],"scopeStatus":"core"},{"id":"peterson","group":"Concurrency","topic":"Peterson’s two-process solution","title":"Express intent, then yield priority","minutes":14,"intro":"If two processes both want a protected region, they need to express interest and break a tie. Peterson’s algorithm uses a flag per process plus a shared turn variable.","why":"The algorithm is a reasoning exercise under an ideal memory model. Its textbook proof is not permission to paste ordinary unsynchronized variables into modern concurrent code.","definition":"Peterson’s solution is a two-participant mutual-exclusion algorithm using flag[2] for intent and turn for tie-breaking, assuming atomic accesses and sequentially consistent ordering.","steps":["For process i with other process j: set flag[i]=true to announce intent, then set turn=j to give the other priority if it also wants entry.","Wait while flag[j] && turn==j. If the other does not want entry, or priority now favors i, enter the critical section.","On exit set flag[i]=false, then execute the remainder section.","If both want entry, turn has a single final value, so only one of the two waiting conditions permits entry. Under the model this establishes mutual exclusion.","If one does not want entry, its flag is false and the interested process can proceed. Intent flags therefore avoid strict alternation’s progress failure.","Under its assumptions the protocol also provides bounded waiting between the two participants. Plain-language or compiler/CPU reordering can invalidate those assumptions; production implementations need correct atomics and memory-order guarantees."],"example":{"question":"P0 sets flag[0]=true, turn=1; P1 sets flag[1]=true, turn=0. Both flags remain true. Who can enter first?","answer":"P0 can enter because its wait condition requires turn==1, which is false. P1 waits because flag[0] is true and turn==0. The final turn write favors P0 in this interleaving."},"misconceptions":["turn alone is not Peterson’s full solution.","The algorithm is for two participants in the presented form.","Atomic loads/stores without the required ordering are not sufficient for the textbook proof on every modern machine."],"recall":"What does flag[i] mean, and why is turn assigned to the other participant?","recallAnswer":"flag[i] announces that i wants entry. Assigning turn to the other resolves simultaneous interest by yielding priority, so the last assignment determines which contender waits.","relatedPa":[],"refs":[{"source":"concurrency","locator":"Slides 31–33: Peterson algorithm and requirement questions"}],"scopeStatus":"core"},{"id":"mutex-locks","group":"Concurrency","topic":"Mutexes, spinlocks and atomic acquisition","title":"The lock itself must not race","minutes":12,"intro":"Putting “if available” before a shared update looks protective, but two processes can both observe available before either changes it. The acquisition needs an indivisible decision.","why":"The lecture gives simplified lock pseudocode. Its atomicity requirement is essential: a separate check followed by a normal store is not a correct lock implementation.","definition":"A mutex protects a critical section through acquisition and release. A spinlock waits by repeatedly testing a condition rather than blocking the executing thread.","steps":["A participant acquires the lock before entering protected work and releases it afterward. All conflicting accesses must follow the same locking discipline.","Acquisition must atomically test and claim availability, typically using supported atomic primitives such as compare-and-swap or test-and-set.","With separate ordinary operations, both P0 and P1 can read available=true, then both write false and enter. This defeats mutual exclusion.","A spinlock consumes execution resources while waiting. It can be appropriate for very short waits in some contexts, but long waits waste CPU and may be harmful on a single core.","Not every mutex spins for its entire wait. Blocking/adaptive mutex implementations can suspend a waiter and use scheduling, so “mutex” and “spinlock” are not universal synonyms.","Release must occur on every intended exit path and use the required ordering so protected updates become visible. Forgetting release can block future work indefinitely."],"example":{"question":"Two threads perform “while not available: wait; available=false” using ordinary separate operations. Is the lock necessarily safe?","answer":"No. Both can pass the availability test before either sets false. The test-and-claim must be atomic, with suitable memory-order semantics."},"misconceptions":["A Boolean variable alone does not make a correct mutex.","Every mutex need not busy-wait.","Locking only writers is insufficient if readers can observe inconsistent intermediate state."],"recall":"Why does a spinlock wait differently from a blocking mutex?","recallAnswer":"A spinlock repeatedly checks while consuming CPU execution; a blocking mutex can put the waiter to sleep until it can be awakened and scheduled.","relatedPa":[],"refs":[{"source":"concurrency","locator":"Slides 34–36: mutex acquire/release, atomicity and spinlock model"}],"scopeStatus":"core"},{"id":"semaphores","group":"Concurrency","topic":"Counting/binary semaphores and producer-consumer coordination","title":"Count resources, then protect the shared update","minutes":16,"intro":"A lock controls one entrant. A semaphore can also represent several available resources, or enforce ordering between activities.","why":"You must state initial values and the order of wait/signal operations. Waiting for data while holding the buffer mutex can prevent the producer from ever providing it.","definition":"A semaphore is a synchronization object manipulated through atomic wait and signal operations. A counting semaphore models available permits; a binary semaphore uses two availability states in the simplified model.","steps":["In the course’s nonnegative busy-wait model, wait(S) waits until S>0 then decrements atomically; signal(S) increments atomically. Blocking implementations can use different internal representations and queues.","A counting semaphore initialized to k allows up to k permits to be acquired. Each completed use should return the appropriate permit; incorrect extra signals can corrupt the resource count.","A binary semaphore can implement exclusion, but it is not identical to every mutex: mutexes normally include ownership rules, while semaphores are also used for cross-thread signaling.","For a bounded buffer of N slots, initialize empty=N, full=0 and mutex=1. The producer waits on empty, then mutex, inserts an item, signals mutex, then full.","The consumer waits on full, then mutex, removes an item, signals mutex, then empty. empty/full track availability; mutex protects buffer bookkeeping.","Do not acquire mutex and then block waiting for full/empty in a way that prevents the other side from changing the condition. Ordering of waits is part of correctness.","Atomic semaphore operations alone do not guarantee fairness, absence of deadlock or correct application logic; those depend on the complete protocol and implementation."],"example":{"question":"A buffer has N=3, currently two items, with no operation in flight. What are full and empty? What happens to them after one successful consume?","answer":"Initially full=2 and empty=1. A consume obtains one full permit and later signals empty, leaving full=1 and empty=2. The mutex protects the actual removal and index updates."},"misconceptions":["Semaphore wait is a synchronization operation, not the process-termination wait() call.","A binary semaphore and an owner-tracking mutex are not interchangeable in every API.","Atomic primitives cannot repair an incorrect ordering of resource acquisition."],"recall":"Why should the consumer obtain a full permit before taking the buffer mutex?","recallAnswer":"If it held the mutex while waiting for an item, a producer needing that mutex could be unable to insert one, producing deadlock in that design.","relatedPa":[],"refs":[{"source":"concurrency","locator":"Slides 37–39: semaphore operations and types; bounded-buffer application is an independently prepared worked extension"}],"scopeStatus":"core"},{"id":"deadlock-starvation","group":"Concurrency","topic":"Deadlock and starvation","title":"No progress for a cycle, or no turn for one waiter","minutes":12,"intro":"Two people each hold an object the other needs and refuse to release it. Elsewhere, one person keeps losing a place in line while everyone else proceeds. These are different failures.","why":"The source’s board/marker example illustrates deadlock; priority scheduling illustrates starvation. Define the mechanism rather than only saying “waiting forever.”","definition":"Deadlock is a state in which participants cannot progress because each awaits a resource/event dependent on another in the blocked set. Starvation is indefinite postponement of a participant while other work may continue.","steps":["In the source analogy, Sandy holds the board and needs the pen; Kevin holds the pen and needs the board. Neither releases what the other needs, so the pair cannot progress.","A lock-order example is P0 holding A while waiting for B and P1 holding B while waiting for A. Acquiring shared locks in a consistent global order can prevent this particular circular pattern.","Starvation can occur when higher-priority work continually bypasses a lower-priority process or a synchronization queue repeatedly favors others.","Aging or suitable fair queuing can reduce starvation; adding fairness does not automatically fix circular resource dependencies.","Busy waiting is an implementation behavior, not itself proof of deadlock. A spinner may eventually acquire a lock; a blocked process may be part of either normal waiting or a deadlock.","Diagnose who holds what, who waits for what, and whether any participant can perform the release needed to unblock the others. Then identify the specific policy or ordering change."],"example":{"question":"P0 holds lock A and waits for B; P1 holds B and waits for A. A third unrelated process keeps running. Is the pair deadlocked or merely starved?","answer":"The pair is deadlocked because each waits for a release the other cannot reach. The unrelated process making progress does not remove the deadlock among P0 and P1."},"misconceptions":["Deadlock need not freeze every process on the whole machine.","Starvation can happen without a circular wait.","High CPU utilization does not prove every process is making progress."],"recall":"Can one process starve while the rest of the system keeps completing work?","recallAnswer":"Yes. Starvation concerns indefinite postponement of that participant; others can continue receiving resources.","relatedPa":[],"refs":[{"source":"concurrency","locator":"Slides 41–44: deadlock, board/marker example, starvation and comparison task"}],"scopeStatus":"core"},{"id":"thread-design-tradeoffs","group":"Threads","topic":"Thread and process design decisions","title":"Choose sharing, isolation, or a hybrid","minutes":12,"intro":"Threads share an address space and cooperate cheaply. Processes add separation and IPC overhead. A hybrid can retain responsiveness while isolating an unreliable component.","why":"Use the Theo scenarios to explain the trade-off, not just name a concept.","definition":"Threads share an address space and cooperate cheaply. Processes add separation and IPC overhead. A hybrid can retain responsiveness while isolating an unreliable component.","steps":["A word processor can use threads for input, spell-check and autosave because they work with the same document. Protect concurrent changes; a fatal error in one thread can bring down the process.","A video editor can keep its UI and audio workers in the main process and place an unreliable codec in a worker process. Send frames or results through IPC. Restarting the worker can preserve the main application.","A shopping app on one core interleaves search, cart and pricing tasks. Three cores can run ready tasks simultaneously, but network waits and short tasks may limit speed gains.","Low utilization per core is not necessarily poor performance: a light workload may simply need little CPU time, and other applications can use idle capacity."],"example":{"question":"A video-processing library crashes occasionally. Should every activity be a thread in one process?","answer":"Not necessarily. Put the unreliable processing in a separate process and use IPC. The UI and audio may remain threads in the main process. Isolation costs communication overhead but can prevent one worker crash from ending the whole application."},"misconceptions":["More threads or cores do not automatically make a program faster.","Shared data still requires coordination; separate processes do not share an address space by default."],"recall":"What property makes the hybrid design worthwhile?","recallAnswer":"Fault isolation for the unreliable component, while keeping inexpensive sharing for cooperating components.","relatedPa":[],"refs":[{"source":"theo4","locator":"Exercises 4-1 to 4-3"}],"scopeStatus":"core"},{"id":"thread-switch-cost","group":"Threads","topic":"Address-space and thread-switch costs","title":"Compare three context-switch cases","minutes":12,"intro":"The important distinction is whether execution switches between address spaces, not whether both execution units are called threads.","why":"Use the Theo scenarios to explain the trade-off, not just name a concept.","definition":"The important distinction is whether execution switches between address spaces, not whether both execution units are called threads.","steps":["Between different processes: save and restore execution state and activate the destination address space.","Between threads in different processes: the address space still changes. Calling both units threads does not remove process-level switching work.","Between threads in the same process: registers, program counter and stack pointer change; the address space and shared resources stay the same.","Same-process switching often costs less, but actual latency depends on architecture, caches, TLB behavior and scheduler implementation. It is not a fixed universal ratio."],"example":{"question":"Which normally avoids changing the address space: A1 → B1 or A1 → A2?","answer":"A1 → A2, where A1 and A2 belong to process A. A1 → B1 moves to process B and normally changes the active address space."},"misconceptions":["More threads or cores do not automatically make a program faster.","Shared data still requires coordination; separate processes do not share an address space by default."],"recall":"Does keeping the address space eliminate all switching overhead?","recallAnswer":"No. Execution state still has to be saved and restored; scheduling and cache effects can still cost time.","relatedPa":[],"refs":[{"source":"theo4","locator":"Exercise 4-4; Context Switching: Three Cases Compared"}],"scopeStatus":"core"},{"id":"multicore-pipelines","group":"Threads","topic":"Multicore challenges and pipelines","title":"Split work without breaking dependencies","minutes":12,"intro":"Data parallelism applies the same operations to separate data. Task parallelism divides operations; a pipeline allows dependent stages to overlap across different items.","why":"Use the Theo scenarios to explain the trade-off, not just name a concept.","definition":"Data parallelism applies the same operations to separate data. Task parallelism divides operations; a pipeline allows dependent stages to overlap across different items.","steps":["Five challenges: identify independent activities; balance work; split data; respect data dependencies; test and debug timing-dependent behavior.","For 1,000 independent images on four equal cores, a simple data split assigns 250 images to each worker. Each worker loads, resizes, filters and saves its own images.","For a task pipeline, stage 1 loads, stage 2 resizes, stage 3 filters, and stage 4 saves. Different stages work simultaneously on different images; one image must still follow the required order.","A stage with much more work becomes a bottleneck. Use synchronized bounded queues between stages and preserve data ownership. A pipeline does not erase dependencies.","For independent images with the same expensive operations, data parallelism is often simpler and better balanced. Unequal image costs may justify a shared work queue rather than fixed equal counts.","Task parallelism does not always require a pipeline. Independent tasks can run without a prescribed stage sequence."],"example":{"question":"With four workers and 1,000 equal-cost independent images, how many images does each data-parallel worker handle?","answer":"$$1000/4=250$$ Each worker performs the complete operation sequence on its 250 images. A task pipeline instead divides the operations, and its throughput is limited by the slowest stage."},"misconceptions":["More threads or cores do not automatically make a program faster.","Shared data still requires coordination; separate processes do not share an address space by default."],"recall":"Can a pipeline resize image 2 while filtering image 1?","recallAnswer":"Yes. The dependency order applies within each image. Different images can occupy different stages at the same time.","relatedPa":[],"refs":[{"source":"theo4","locator":"Exercise 4-5; Five Challenges; Pipeline; Independent vs. Dependent Tasks"}],"scopeStatus":"core"}]'),P7=JSON.parse('[{"topic":"Operating system purpose","source":"services","locator":"Slides 4–8: OS definition, kernel/utilities and user/system views","lessonId":"os-purpose","status":"core"},{"topic":"Virtualization, abstraction and arbitration","source":"intro","locator":"Slides 15–24: virtualization/concurrency/persistence and abstraction/arbitration","lessonId":"abstraction-arbitration","status":"core"},{"topic":"Computer and OS evolution; Linux","source":"intro","locator":"Slides 25–35 and slide 41 evolution task; PA1 solutions Exercise 1-6","lessonId":"evolution-linux","status":"core"},{"topic":"Computer and OS evolution; Linux","source":"pa1a","locator":"Page 3, Exercise 1-6","lessonId":"evolution-linux","status":"core"},{"topic":"Computer architecture and instruction cycle","source":"intro","locator":"Slides 36–39: instruction cycle, von Neumann architecture and bus questions","lessonId":"architecture-cycle","status":"core"},{"topic":"Computer architecture and instruction cycle","source":"pa1a","locator":"Pages 2–3, Exercises 1-4 and 1-5","lessonId":"architecture-cycle","status":"core"},{"topic":"Memory and storage hierarchy","source":"services","locator":"Memory- },{"topic":"Multiprocessor scheduling and real-time latency","source":"scheduling","locator":"Slides 32–40: multicore, AMP/SMP, affinity, balancing and real-time latency","lessonId":"multicore-realtime","status":"core"},{"topic":"Race conditions and bounded producer-consumer","source":"concurrency","locator":"Slides 11–24: concurrent inconsistency, bounded buffer and counter interleavings","lessonId":"race-producer-consumer","status":"core"},{"topic":"Critical sections and correctness requirements","source":"concurrency","locator":"Slides 25–30: critical sections, requirements and strict alternation","lessonId":"critical-section","status":"core"},{"topic":"Peterson’s two-process solution","source":"concurrency","locator":"Slides 31–33: Peterson algorithm and requirement questions","lessonId":"peterson","status":"core"},{"topic":"Mutexes, spinlocks and atomic acquisition","source":"concurrency","locator":"Slides 34–36: mutex acquire/release, atomicity and spinlock model","lessonId":"mutex-locks","status":"core"},{"topic":"Counting/binary semaphores and producer-consumer coordination","source":"concurrency","locator":"Slides 37–39: semaphore operations and types; bounded-buffer application is an independently prepared worked extension","lessonId":"semaphores","status":"core"},{"topic":"Deadlock and starvation","source":"concurrency","locator":"Slides 41–44: deadlock, board/marker example, starvation and comparison task","lessonId":"deadlock-starvation","status":"core"},{"topic":"Bootstrap and boot process — Theo extension","source":"theo2","locator":"CMOS Memory; Timer","lessonId":"boot-sequence","status":"covered"},{"topic":"Device drivers, controllers and I/O — Theo extension","source":"theo2","locator":"Buffering, Caching & Spooling; Device Controllers & Drivers","lessonId":"io-path","status":"covered"},{"topic":"Multiprocessor scheduling and real-time latency — Theo extension","source":"theo5","locator":"Exercises 5-9 to 5-12","lessonId":"multicore-realtime","status":"covered"},{"topic":"Multilevel and feedback queues — Theo extension","source":"theo5","locator":"Exercises 5-7 and 5-8","lessonId":"multilevel-queues","status":"covered"},{"topic":"Thread and process design decisions","source":"theo4","locator":"Exercises 4-1 to 4-3","lessonId":"thread-design-tradeoffs","status":"covered"},{"topic":"Address-space and thread-switch costs","source":"theo4","locator":"Exercise 4-4; Context Switching: Three Cases Compared","lessonId":"thread-switch-cost","status":"covered"},{"topic":"Multicore challenges and pipelines","source":"theo4","locator":"Exercise 4-5; Five Challenges; Pipeline; Independent vs. Dependent Tasks","lessonId":"multicore-pipelines","status":"covered"},{"topic":"User mode and kernel mode — Theo extension","source":"theo2","locator":"Exercises 2-2 and 2-3","lessonId":"dual-mode","status":"covered"},{"topic":"System-call interface and APIs — Theo extension","source":"theo2","locator":"Exercise 2-4","lessonId":"system-calls","status":"covered"},{"topic":"Interrupts, traps, exceptions and timers — Theo extension","source":"theo2","locator":"Exercises 2-5 and 2-6","lessonId":"interrupts","status":"covered"},{"topic":"Base/limit memory protection — Theo extension","source":"theo2","locator":"Exercise 2-7","lessonId":"memory-protection","status":"covered"},{"topic":"Virtual machines and VMMs — Theo extension","source":"theo2","locator":"Exercise 2-8","lessonId":"virtual-machines","status":"covered"},{"topic":"Cooperating processes and shared-memory IPC — Theo extension","source":"theo2","locator":"Exercise 2-9","lessonId":"shared-memory","status":"covered"},{"topic":"Message passing and buffering — Theo extension","source":"theo2","locator":"Exercise 2-9","lessonId":"message-passing","status":"covered"},{"topic":"Monolithic, layered, microkernel, modular and hybrid designs — Theo extension","source":"theo2","locator":"Exercise 2-10","lessonId":"os-structures","status":"covered"},{"topic":"Program, process and memory layout — Theo extension","source":"theo3","locator":"Exercise 3.1","lessonId":"program-process","status":"covered"},{"topic":"Five-state process model — Theo extension","source":"theo3","locator":"Exercises 3.2 and 3.3","lessonId":"process-states","status":"covered"},{"topic":"Process Control Block and identity — Theo extension","source":"theo3","locator":"Exercises 3.4 and 3.6","lessonId":"pcb","status":"covered"},{"topic":"Context switching — Theo extension","source":"theo3","locator":"Exercises 3.4 and 3.5","lessonId":"context-switch","status":"covered"},{"topic":"Process creation and parent/child execution — Theo extension","source":"theo3","locator":"Exercises 3.7 and 3.8","lessonId":"fork-exec-wait","status":"covered"},{"topic":"Exit, wait, zombies and orphans — Theo extension","source":"theo3","locator":"Exercises 3.9 to 3.11","lessonId":"process-termination","status":"covered"},{"topic":"Cooperating processes and shared-memory IPC — Theo extension","source":"theo3","locator":"Exercise 3.12","lessonId":"shared-memory","status":"covered"},{"topic":"Message passing and buffering — Theo extension","source":"theo3","locator":"Exercise 3.12","lessonId":"message-passing","status":"covered"},{"topic":"Thread state and shared process resources — Theo extension","source":"theo4","locator":"Introduction to Threads","lessonId":"thread-resources","status":"covered"},{"topic":"User/kernel thread mappings — Theo extension","source":"theo4","locator":"Exercise 4-6","lessonId":"threading-models","status":"covered"},{"topic":"Turnaround, waiting, response and utilization — Theo extension","source":"theo5","locator":"Where the Three Times Come From","lessonId":"scheduling-metrics","status":"covered"},{"topic":"FCFS, SJF and burst prediction — Theo extension","source":"theo5","locator":"Exercises 5-1 and 5-2; additional examples","lessonId":"fcfs-sjf","status":"covered"},{"topic":"Priority scheduling and aging — Theo extension","source":"theo5","locator":"Exercises 5-3 and 5-6; additional examples","lessonId":"priority-scheduling","status":"covered"},{"topic":"Round Robin and time quantum — Theo extension","source":"theo5","locator":"Exercise 5-4; additional examples","lessonId":"round-robin","status":"covered"},{"topic":"Shortest remaining time scheduling — Theo extension","source":"theo5","locator":"Exercise 5-5; additional examples","lessonId":"srt","status":"covered"}]'),qh={sources:R7,scopeNote:q7,lessons:D7,coverage:P7},U7=[{id:"pa1q",title:"OS - Practice Assignment 1 - OS Basics.pdf",url:"https://drive.google.com/file/d/13UyxcQVujSE4KXWYkoCH4KuQWobD7TqU/view"},{id:"pa1a",title:"OS - Practice Assignment 1 Solutions - OS Basics.pdf",url:"https://drive.google.com/file/d/1DYjErSZngV_oTTBsbRQgkfb_zgJOoidJ/view"},{id:"pa2q",title:"OS - Practice Assignment 02 - OS Services & Structures - Questions.pdf",url:"https://drive.google.com/file/d/1US_x6GKnC3lN96Z6KQjBguLInm9oZWQk/view"},{id:"pa2a",title:"OS - Practice Assignment 02 - OS Services & Structures - Solutions.pdf",url:"https://drive.google.com/file/d/1BCwf3-ur33vakpjnFIrb2UdpZxiZchnf/view"},{id:"pa3q",title:"OS - Practice Assignment 03 - Processes - Questions.pdf",url:"https://drive.google.com/file/d/1jbzfg8sQB-_Emd1T3j9crjGY9Vhj-Zbr/view"},{id:"pa3a",title:"OS - Practice Assignment 03 - Processes - Solutions.pdf",url:"https://drive.google.com/file/d/1tQoLoy6FQJ_mSyjMSwTpMGUnId7_I0CN/view"},{id:"pa_alt",title:"OS - Practice Assignment 01 - Process Concepts (Alternate Set).pdf",url:"https://drive.google.com/file/d/1kHB9HMfRMSQkVc8NVt1ZN1nIy3cmnhmc/view"},{id:"linux-wait",title:"Linux man-pages: wait(2)",url:"https://man7.org/linux/man-pages/man2/wait.2.html"},{id:"linux-fork",title:"Linux man-pages: fork(2)",url:"https://man7.org/linux/man-pages/man2/fork.2.html"},{id:"linux-entry",title:"Linux kernel documentation: Entry/exit handling",url:"https://docs.kernel.org/core-api/entry.html"},{id:"linux-syscall-intro",title:"Linux man-pages: intro(2)",url:"https://man7.org/linux/man-pages/man2/intro.2.html"}],B7=JSON.parse('[{"id":"PA1-01","assignment":"PA1","number":1,"title":"What an operating system does","topic":"OS purpose","group":"Foundations","difficulty":"Foundation","question":"What is an Operating System?","hints":["Think about the layer between an application and physical hardware.","Name at least three resources and explain who controls their use."],"checklist":["Define the OS as system software.","Explain its role between applications/users and hardware.","Identify CPU, memory and I/O/storage management.","Mention useful services and protection."],"answer":"An operating system is system software that manages a computer’s resources and provides controlled services through which applications and users use the hardware. It allocates CPU time, manages memory, organizes files and coordinates I/O devices. It also enforces protection so one program cannot freely damage the OS or another program. For example, a text editor asks the OS to save a file instead of directly controlling a disk controller.","explanation":["Begin with the definition: software that manages resources and provides an execution environment.","Make “resources” concrete: CPU execution time, RAM, storage and devices.","Connect management to an example such as opening a file or running multiple applications.","Include protection: convenience alone does not explain why applications cannot operate hardware arbitrarily."],"mistakes":["Calling the OS only a graphical interface.","Confusing an application such as Word with the OS.","Claiming every computer program must always run under an OS; bare-metal programs exist."],"relatedLessons":["os-purpose"],"refs":[{"source":"pa1q","locator":"Page 1, Exercise 1-1"},{"source":"pa1a","locator":"Page 1, Exercise 1-1 solution"}]},{"id":"PA1-02","assignment":"PA1","number":2,"title":"Purposes of an OS","topic":"OS purpose","group":"Foundations","difficulty":"Foundation","question":"What are the Main Purposes of an Operating System?","hints":["Organize your answer around managing resources, making them convenient to use, and controlling access.","Give one example for each purpose rather than listing OS names."],"checklist":["Resource management and efficient allocation.","Convenient abstractions and services for users/programmers.","Control, security and protection.","One appropriate example for each."],"answer":"The main purposes are resource management, convenience, and control/protection. Resource management allocates CPU time, memory and devices among competing activities; for example, the scheduler lets several applications make progress. Convenience provides abstractions such as files and system calls, so a program can save data without implementing a disk driver. Control and protection restrict access and isolate programs; for example, memory protection prevents an ordinary process from reading another process’s private memory.","explanation":["State the three purposes explicitly.","For each purpose, explain the problem it solves.","Use an example that demonstrates the purpose: a file API for convenience, CPU scheduling for allocation, address-space isolation for protection.","Efficiency and fairness can conflict; an OS balances policy goals rather than maximizing every goal simultaneously."],"mistakes":["Giving only examples without stating the purposes.","Equating convenience with a GUI only.","Claiming fairness always means equal resource shares."],"relatedLessons":["os-purpose","abstraction-arbitration","os-services"],"refs":[{"source":"pa1q","locator":"Page 1, Exercise 1-2"},{"source":"pa1a","locator":"Page 1, Exercise 1-2 solution"}]},{"id":"PA1-03","assignment":"PA1","number":3,"title":"Three modern OS challenges","topic":"OS challenges","group":"Foundations","difficulty":"Application","question":"Discuss three fundamental challenges encountered by modern operating systems, providing a concrete example to illustrate each challenge.","hints":["Choose concurrency, resource allocation and protection/security.","For each, describe a potential conflict before describing an example."],"checklist":["Explain concurrency and give a concrete example.","Explain allocation among competing requests and give an example.","Explain security/protection and give an example.","Distinguish the challenge from the mechanism used to solve it."],"answer":"Concurrency: many activities progress during overlapping periods, so the OS must coordinate execution and shared resources. A browser, audio player and download service must coexist without one unnecessarily blocking the others. Resource allocation: CPU, RAM and devices are finite, so the OS must choose who gets them and when. Several users submitting print jobs need an orderly queue and a policy for sharing the printer. Security/protection: programs and users must not obtain unauthorized access or corrupt each other. An untrusted application should be unable to read another user’s confidential files or overwrite the kernel.","explanation":["A challenge is a problem the OS must manage, not merely a feature name.","Concurrency does not require simultaneous execution on multiple cores; interleaving on one core is also concurrent.","Resource allocation needs both mechanisms and policies: a queue is a mechanism, and the ordering rule is a policy.","Protection controls allowed operations; security includes defending against malicious misuse."],"mistakes":["Saying single-core systems cannot be concurrent.","Using the same unexplained “multitasking” example for all three challenges.","Claiming operating systems eliminate all security risks."],"relatedLessons":["abstraction-arbitration"],"refs":[{"source":"pa1q","locator":"Page 1, Exercise 1-3"},{"source":"pa1a","locator":"Page 2, Exercise 1-3 solution"}]},{"id":"PA1-04","assignment":"PA1","number":4,"title":"Computer architecture","topic":"Computer architecture","group":"Foundations","difficulty":"Foundation","question":"What is Computer Architecture?","hints":["Consider instructions, memory and I/O, not just the shape of the motherboard.","Explain how the CPU communicates with the other components."],"checklist":["Describe the organization/interface of a computer system.","Mention CPU, memory and I/O relationships.","Include the instruction set and memory organization.","Give a meaningful architecture example."],"answer":"Computer architecture describes the structure and behavior of a computer system: the operations its processor supports and the way processing, memory and I/O fit together. Relevant aspects include the instruction set architecture (ISA), memory organization and mechanisms for communicating with devices. In a classical von Neumann design, instructions and data share memory; in a classical Harvard design, they use separate instruction and data memories and paths.","explanation":["Describe the computer as a system rather than an isolated CPU.","Explain the ISA as the programmer-visible instructions and related behavior.","Explain memory and I/O organization as the routes by which instructions and data reach processing units.","Use Harvard versus von Neumann as one example, not an exhaustive list of all possible architectures."],"mistakes":["Defining architecture only as processor clock speed.","Treating hardware implementation and ISA as identical concepts.","Claiming Harvard and von Neumann are the only ways computers can be classified."],"relatedLessons":["architecture-cycle","storage-hierarchy"],"refs":[{"source":"pa1q","locator":"Page 1, Exercise 1-4"},{"source":"pa1a","locator":"Page 2, Exercise 1-4 solution"}],"technicalNote":"The course uses “computer architecture” broadly to include organization and implementation. More precise texts distinguish the programmer-visible architecture/ISA from the microarchitecture that implements it."},{"id":"PA1-05","assignment":"PA1","number":5,"title":"Harvard versus von Neumann","topic":"Computer architecture","group":"Foundations","difficulty":"Comparison","question":"Compare the Harvard and von Neumann architectures with respect to their memory organization, design complexity, performance, and primary applications.","hints":["Use the four requested axes: memory, complexity, performance and applications.","Ask whether instruction fetch and data access share a path."],"checklist":["von Neumann has a shared instruction/data memory model.","Harvard separates instruction/data memories and paths.","Explain typical design-complexity trade-off.","Explain the shared-path bottleneck and potential parallel access.","Give suitable application examples without absolute claims."],"answer":"Memory: classical von Neumann systems use one memory for instructions and data and a shared access path; classical Harvard systems use separate instruction and data memories and paths. Complexity: the shared organization is conceptually simpler, while separate memories/buses require more hardware and coordination. Performance: sharing a path can make instruction fetch compete with data access—the von Neumann bottleneck. Harvard can fetch an instruction and access data at the same time, although overall speed still depends on the implementation and workload. Applications: the von Neumann model is common in general-purpose computing; Harvard-style designs are common in microcontrollers and DSPs.","explanation":["State how memory is organized before discussing performance.","Derive the bottleneck from contention for the shared path.","Explain why separate paths permit overlap, rather than claiming they make every workload faster.","Relate flexibility and complexity to typical uses. Modern general-purpose processors often have separate instruction/data caches while retaining a unified main-memory model."],"mistakes":["Saying Harvard always runs faster.","Saying von Neumann cannot store instructions.","Assuming every modern desktop has one physical bus and no separate instruction cache."],"relatedLessons":["architecture-cycle"],"refs":[{"source":"pa1q","locator":"Page 1, Exercise 1-5"},{"source":"pa1a","locator":"Page 3, Exercise 1-5 solution"}],"technicalNote":"The comparison concerns the classical models. Modified-Harvard implementations blur the simple classification; separate caches do not necessarily mean separate programmer-visible main memories."},{"id":"PA1-06","assignment":"PA1","number":6,"title":"Linux and distributions","topic":"Linux","group":"Foundations","difficulty":"Foundation","question":"What is Linux?","hints":["Distinguish the kernel from a complete distribution.","Give an example of software that a distribution packages around its kernel."],"checklist":["Identify Linux as an open-source kernel.","Explain common broader usage for Linux-based operating systems.","Mention distributions and give examples.","Give appropriate usage contexts and licensing qualification."],"answer":"Strictly, Linux is an open-source operating-system kernel, first released by Linus Torvalds in 1991. In common usage, “Linux” also refers to complete operating systems built around that kernel. A distribution packages the kernel with libraries, command-line tools, package management and often a desktop environment; examples include Debian, Ubuntu and Fedora. Linux-based systems are used in servers, personal computers, embedded devices and supercomputers. Source code can be studied and modified, and redistribution is permitted subject to the applicable licenses.","explanation":["The kernel handles core mechanisms such as processes, memory and devices.","A usable distribution includes more than the kernel: a shell, libraries and administration tools.","Give a distribution example to demonstrate the difference.","Open source describes licensing and access to source; it does not guarantee that every related product or support service is free of charge."],"mistakes":["Calling Ubuntu a different kernel from Linux.","Saying every Linux installation is automatically secure.","Saying open-source redistribution has no license conditions."],"relatedLessons":["evolution-linux"],"refs":[{"source":"pa1q","locator":"Page 1, Exercise 1-6"},{"source":"pa1a","locator":"Page 3, Exercise 1-6 solution"}],"technicalNote":"The official answer uses Linux in the broad distribution-family sense. The kernel/distribution distinction makes that answer more precise."},{"id":"PA2-01","assignment":"PA2","number":1,"title":"Boot from power-on to kernel","topic":"Boot sequence","group":"Services","difficulty":"Sequence","question":"Explain what happens when a computer is powered on, from pressing the power button until the operating system starts running.","hints":["Start with firmware, not with the OS already running.","Separate firmware checks, locating a boot target, loading the kernel and kernel initialization."],"checklist":["CPU begins firmware execution after reset.","Describe POST and hardware initialization.","Use boot configuration to select a boot target.","Bootloader loads kernel into RAM and transfers control.","Kernel initializes services/drivers and starts the initial user-space environment."],"answer":"After power-on and reset, the CPU starts firmware execution. In the course’s BIOS model, the BIOS performs POST to check essential hardware and initializes the system. It consults saved configuration, including boot order, locates a bootable device and starts a bootloader. The bootloader loads the OS kernel into memory and transfers control to it. The kernel initializes memory management, device support and process management, then starts the initial user-space process and services. A login interface may appear after these services start.","explanation":["Firmware exists before the disk-based OS has loaded.","POST checks and initialization prepare hardware for booting; they are not application execution.","The bootloader bridges firmware and the kernel by placing the kernel in memory and transferring control.","The kernel establishes OS mechanisms; a graphical login is a later user-space outcome, not the definition of kernel startup."],"mistakes":["Saying the BIOS is loaded from the operating-system partition.","Skipping the bootloader/kernel hand-off.","Assuming a graphical login must exist on every OS."],"relatedLessons":["boot-sequence","os-services"],"refs":[{"source":"pa2q","locator":"Page 1, Exercise 2-1"},{"source":"pa2a","locator":"Page 1, Exercise 2-1 solution"}],"technicalNote":"BIOS is the model used by the assignment. Many current machines use UEFI firmware and an EFI boot manager/loader; the high-level firmware → loader → kernel sequence remains useful."},{"id":"PA2-02","assignment":"PA2","number":2,"title":"Dual-mode operation","topic":"User and kernel mode","group":"Services","difficulty":"Foundation","question":"Explain the concept of Dual Mode Operation. What is the difference between User Mode and Kernel Mode, and why is Dual Mode essential for system protection?","hints":["A user account and the CPU privilege mode are different things.","Explain what happens when an application needs an operation it cannot perform directly."],"checklist":["User mode restricts privileged operations.","Kernel mode permits protected OS operations.","Hardware enforces the privilege distinction.","System calls/interrupts/exceptions enter controlled handlers.","Explain isolation and validation of application requests."],"answer":"Dual-mode operation separates ordinary application execution from privileged OS execution. In user mode, a program cannot freely execute privileged instructions or access protected kernel memory/devices. In kernel mode, the OS can perform those privileged operations. Hardware records and enforces the current privilege level. An application requests a service through a controlled entry such as a system call; the kernel validates the request, performs an allowed operation and returns. This prevents a faulty or malicious application from directly taking over hardware or corrupting the whole system.","explanation":["First distinguish the CPU modes and their privileges.","Explain that hardware protection, not a voluntary programming convention, enforces the boundary.","Explain the controlled gateway used for legitimate requests.","Link the design to protection: the application receives only the service it is allowed to request, not unrestricted kernel authority."],"mistakes":["Equating kernel mode with being logged in as administrator.","Claiming a system call permanently converts the application into kernel code.","Assuming kernel mode makes buggy code harmless."],"relatedLessons":["dual-mode"],"refs":[{"source":"pa2q","locator":"Page 1, Exercise 2-2"},{"source":"pa2a","locator":"Page 1, Exercise 2-2 solution"}]},{"id":"PA2-03","assignment":"PA2","number":3,"title":"Classify seven mode scenarios","topic":"User and kernel mode","group":"Services","difficulty":"Application","question":"For each of the following operations, determine whether it is performed in User Mode or Kernel Mode and justify your answer:\\na) A user types and edits text in Microsoft Word.\\nb) A program requests to read data from a file.\\nc) Installing/loading a new device driver into the operating system.\\nd) The operating system executes a device driver to communicate with a printer.\\ne) A calculator application performs a mathematical calculation.\\nf) The operating system handles a hardware interrupt from the keyboard.\\ng) A program attempts to access a memory page that is not currently available in physical memory, causing a page fault.","hints":["Separate initiating a request from handling it.","Normal computation stays in user mode; protected service and exception handlers execute in kernel mode."],"checklist":["a: Word editing logic is user mode.","b: request begins in user mode; kernel services the file read.","c: privileged driver loading is kernel mode in the course model.","d: kernel driver hardware operation is kernel mode.","e: calculator arithmetic is user mode.","f: keyboard interrupt handling is kernel mode.","g: user instruction can cause fault; page-fault handler is kernel mode."],"answer":"a) User mode for Word’s ordinary editing logic. b) The program initiates the request in user mode; a system call transfers control to kernel mode for the protected file-service operation. c) Kernel mode for the privileged act of loading a kernel device driver; the installer interface may run in user mode. d) Kernel mode for the kernel driver’s protected communication with the printer. e) User mode for normal calculator arithmetic. f) Kernel mode for the hardware interrupt handler. g) The attempted memory access may occur in user mode; the resulting page-fault exception is handled in kernel mode.","explanation":["Identify the instruction being classified instead of assigning one mode to an entire multi-stage activity.","For b, a user-space wrapper prepares a request, then the kernel checks and services it.","For g, the fault is synchronous with an instruction; the handler decides whether to make a valid page available or reject an invalid access.","For c and d, use the kernel-driver model specified by the assignment while recognizing that some real systems also support user-space drivers."],"mistakes":["Classifying the file-read request and its kernel handling as the same execution step.","Saying every page fault means the program is erroneous.","Saying calculator arithmetic requires a system call."],"relatedLessons":["dual-mode","system-calls","os-services"],"refs":[{"source":"pa2q","locator":"Page 1, Exercise 2-3"},{"source":"pa2a","locator":"Page 2, Exercise 2-3 solution"},{"source":"linux-syscall-intro","locator":"DESCRIPTION: library wrapper and kernel entry"}],"technicalNote":"The answer key labels b and g “Kernel Mode,” referring to service/fault handling. The complete execution begins with a user-mode request or instruction, followed by kernel handling. Kernel-driver assumptions do not describe every possible driver architecture."},{"id":"PA2-04","assignment":"PA2","number":4,"title":"Follow a print request","topic":"System calls and interrupts","group":"Services","difficulty":"Integration","question":"A user is working in Microsoft Word and clicks the Print button to print a document. Explain what happens from the moment the user clicks Print until the printer finishes the operation. In your answer, explain the roles of user mode, kernel mode, the system call, system call table, device driver, device controller, hardware interrupt, Interrupt Descriptor Table (IDT), and interrupt service routine (ISR).","hints":["Trace the software request first, then the later asynchronous device event.","Use two different mappings: system-call number → service; interrupt vector → handler.","Returning to user execution and switching to a different process are separate decisions."],"checklist":["Word initiates printing in user mode.","System call provides a controlled kernel entry.","System-call number/table dispatches the requested service.","Software driver controls the hardware controller.","Controller/device performs I/O while CPU may do other work.","A hardware interrupt reports an event needing attention.","IDT/vector identifies interrupt entry; ISR services the event.","Restore interrupted context or schedule appropriately; do not equate all interrupts with process switches."],"answer":"Word handles the Print click in user mode and asks the OS printing services to submit the document. A system call enters the kernel through a controlled path. The kernel uses the system-call number and its dispatch mechanism (represented by the system call table) to select and validate the service. In the assignment’s simplified device model, a software device driver issues commands/data to the hardware device controller, which manages the printer operation. The CPU can execute other work while I/O proceeds; a blocked task waits, while ready tasks can run. When the controller requires attention or reports completion, it raises a hardware interrupt. On x86, the interrupt vector selects an IDT entry leading to the ISR. The ISR acknowledges/services the event and may make a waiting task ready. The interrupt-return path restores the appropriate execution context; scheduling may choose another ready task when required.","explanation":["Separate application-level printing from direct hardware control: Word does not write arbitrary controller registers.","Distinguish the system call table from the IDT. One dispatches a requested OS service; the other provides interrupt/exception entry points on x86.","Distinguish the driver (software) from the controller (hardware).","Model I/O as asynchronous relative to CPU execution, so the CPU need not spin until a page finishes.","An ISR can wake a task, but wake-up ordinarily makes it Ready; the scheduler decides when it runs.","Returning from an interrupt resumes the saved context unless scheduling or other handling changes that path."],"mistakes":["Using the IDT as the system call table.","Saying the device driver is the physical printer controller.","Saying the CPU must remain idle until printing completes.","Assuming every hardware interrupt places the interrupted process in Waiting.","Assuming every interrupt necessarily returns directly to user mode."],"relatedLessons":["system-calls","io-path"],"refs":[{"source":"pa2q","locator":"Page 1, Exercise 2-4"},{"source":"pa2a","locator":"Page 3, Exercise 2-4 solution"},{"source":"linux-entry","locator":"Interrupts and regular exceptions; separate user-space and kernel-space entry/exit paths"}],"technicalNote":"The official key’s statement that the CPU “doesn’t wait by returning to user mode” is misleading: it can return to user work while I/O proceeds. An interrupt may arrive during user or kernel execution and return to the appropriate context. Real print stacks include spoolers, transport drivers and possibly network communication; this is the course’s simplified conceptual journey."},{"id":"PA2-05","assignment":"PA2","number":5,"title":"Exception, trap or interrupt?","topic":"System calls and interrupts","group":"Services","difficulty":"Comparison","question":"Explain the difference between an exception, a trap, and a hardware interrupt. Give an example of each and explain how each event is handled.","hints":["Ask whether the event is caused by the currently executing instruction.","For a trap, use the course’s intentional software-entry terminology and mention its limits."],"checklist":["Exception is synchronous with instruction execution.","Trap is an intentional synchronous software entry in the course model.","Hardware interrupt is asynchronous relative to the current instruction stream.","Give a concrete example of each.","Explain controlled handler entry, service/error handling and appropriate return."],"answer":"An exception is synchronous with the executing instruction, such as a divide error or page fault; the CPU transfers control to the appropriate OS exception handler. The handler may resolve the condition, report a signal/error or terminate the task. In the course terminology, a trap is an intentional synchronous software event used to enter an OS service, such as a system-call request; the kernel dispatches the service and returns a result. A hardware interrupt is an asynchronous device event, such as an I/O completion or timer event; an interrupt vector identifies the handler, which acknowledges and services the event before returning appropriately.","explanation":["Synchronous means caused by an instruction being executed, not merely that an event happens quickly.","A divide error illustrates an exceptional condition; a requested system service illustrates deliberate entry.","A device completion can occur regardless of what unrelated application instruction the CPU is executing.","IDT is an x86-specific structure; the broader idea is an architecture-defined handler entry mechanism."],"mistakes":["Calling a hardware interrupt a program’s normal function call.","Saying all exceptions terminate a process.","Claiming every system call on every CPU uses an IDT interrupt gate."],"relatedLessons":["system-calls","interrupts"],"refs":[{"source":"pa2q","locator":"Page 2, Exercise 2-5"},{"source":"pa2a","locator":"Page 3, Exercise 2-5 solution"}],"technicalNote":"“Trap” is used differently across textbooks and CPU manuals. On x86, traps are also a class of exceptions reported after an instruction; modern syscall instructions can use dedicated entry paths. Use the assignment’s distinction for the answer, with this qualification."},{"id":"PA2-06","assignment":"PA2","number":6,"title":"Simultaneous interrupts","topic":"Interrupt handling","group":"Services","difficulty":"Application","question":"What happens when multiple interrupts occur at the same time? Explain two approaches for handling multiple interrupts.","hints":["Compare deferred handling with nested priority handling.","Explain the latency trade-off, not just the order."],"checklist":["Identify that interrupt hardware/OS arbitrates pending events.","Describe masking/deferred sequential handling.","Describe priorities and permitted nesting.","Explain simplicity versus responsiveness/complexity.","Avoid implying disabled interrupts are necessarily discarded."],"answer":"Two common conceptual approaches are sequential handling by masking and priority-based handling. With masking, the CPU/controller temporarily prevents selected interrupt requests from being serviced while a handler runs; pending requests are serviced afterward. This simplifies handler execution but can delay urgent work. With priorities, the interrupt controller and OS rank requests; a higher-priority permitted interrupt can be handled before a lower-priority one and, on systems that support it, can preempt a lower-priority handler. This reduces latency for urgent events but increases nesting and state-management complexity.","explanation":["Simultaneous arrival does not mean the CPU executes all handlers at one instant on the same core.","For masking, distinguish “not serviced yet” from “not recorded.”","For priorities, distinguish choosing among pending interrupts from allowing nested handlers.","Specify that exact masking, nesting and pending behavior depends on the architecture and interrupt controller."],"mistakes":["Saying all interrupts are lost whenever interrupts are disabled.","Saying every operating system allows arbitrary interrupt nesting.","Saying priority handling has no overhead or complexity."],"relatedLessons":["interrupts"],"refs":[{"source":"pa2q","locator":"Page 2, Exercise 2-6"},{"source":"pa2a","locator":"Page 4, Exercise 2-6 solution"}],"technicalNote":"The key presents two general OS-design approaches. Non-maskable events and architecture-specific rules limit what “disabling interrupts” can mean; ordinary masking does not disable every possible CPU event."},{"id":"PA2-07","assignment":"PA2","number":7,"title":"Base and limit protection","topic":"Memory protection","group":"Services","difficulty":"Calculation","question":"A process is loaded into memory with a Base Register = 4000 and a Limit Register = 1200.\\na) What is the valid memory address range that the process can access?\\nb) Determine whether each of the following memory addresses is valid or invalid: 4200, 5100, and 5500.\\nc) What happens if the process attempts to access an invalid memory address?","hints":["Here the limit is the length of the permitted region, not its last address.","Use base ≤ address < base + limit."],"checklist":["Compute 4000 + 1200 = 5200 as the exclusive upper boundary.","State inclusive range 4000–5199.","4200 valid; 5100 valid; 5500 invalid.","Explain a hardware protection exception and OS handling.","Keep physical-address and logical-offset conventions distinct."],"answer":"a) Limit is a length. Valid physical addresses satisfy $$4000 \\\\le a < 4000+1200=5200.$$ The inclusive range is 4000–5199.\\n\\nb) 4200 is valid: offset $4200-4000=200$.\\n5100 is valid: offset $5100-4000=1100$.\\n5500 is invalid: offset $5500-4

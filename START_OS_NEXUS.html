000=1500 \\\\ge 1200$.\\n\\nc) Hardware raises a protection exception. The OS handles the fault, commonly terminating the offending process; it does not permit the illegal access.","explanation":["Interpret the limit before calculating: the source explicitly uses it as a size.","Add base and length to find the first forbidden address, 5200.","Test each address using the inequality or subtract the base and test 0 ≤ offset < 1200.","Explain that user code cannot simply rewrite the protection registers to escape the restriction."],"mistakes":["Including 5200 as valid.","Using 1200 as the final physical address.","Calling 5100 invalid because it is larger than 1200.","Saying invalid access is silently accepted or automatically allocated memory."],"relatedLessons":["memory-protection"],"refs":[{"source":"pa2q","locator":"Page 2, Exercise 2-7"},{"source":"pa2a","locator":"Page 4, Exercise 2-7 solution"}],"technicalNote":"These numbers are treated as physical addresses by the assignment. In a relocation model, a program may instead generate logical offsets 0–1199, which hardware checks and adds to the base; do not mix the two conventions."},{"id":"PA2-08","assignment":"PA2","number":8,"title":"Virtual machines and allocation","topic":"Virtualization","group":"Services","difficulty":"Application","question":"What is a Virtual Machine (VM), and what is the role of the Virtual Machine Manager (VMM)? Explain how virtualization allows multiple users to share physical hardware instead of reserving the entire machine for a single user. For example, a cloud server may contain a CPU and GPU, each with a different number of cores. Explain how CPU and GPU resources can be divided or shared among different VMs according to the cloud provider’s resource-allocation policy.","hints":["A VM receives a virtual hardware view; its assigned resources need not be an entire physical server.","Treat CPU and GPU allocation as separate policies and mechanisms."],"checklist":["Define a VM with isolated guest OS and virtual resources.","Describe VMM/hypervisor allocation and isolation.","Explain time sharing and/or dedicated CPU allocation.","Explain memory/storage allocation.","Qualify GPU sharing: passthrough, partitioning or time sharing depend on hardware/software support.","Do not equate vCPUs and GPU cores or assume a fixed allocation ratio."],"answer":"A virtual machine is an isolated execution environment that presents virtual hardware on which a guest OS can run. The VMM, or hypervisor, manages that hardware view, schedules access to physical resources and enforces isolation among guests. A provider can assign each VM memory, virtual disks and a chosen number of virtual CPUs. vCPUs can share physical CPU execution time or be backed by dedicated capacity, depending on policy. GPU access may use whole-device passthrough, supported hardware partitions, or supported time sharing/virtual GPU mechanisms. CPU and GPU allocations are chosen independently according to workload, hardware support and provider policy, so several customers can share one physical server without each owning all its resources.","explanation":["Start with a VM’s abstraction and isolation, then name the hypervisor’s management role.","Give a policy example: VM A receives two vCPUs and VM B receives four, with scheduling across the available physical CPU capacity.","Do not infer GPU allocation from those vCPU counts; GPU hardware and virtualization support impose separate constraints.","A provider may reserve resources or overcommit some resources. Neither is required by the definition of virtualization."],"mistakes":["Saying a VM must occupy a whole server.","Equating virtual CPU count with guaranteed permanently dedicated physical cores.","Treating a GPU core as interchangeable with a CPU core.","Claiming every GPU supports arbitrary per-core partitioning."],"relatedLessons":["virtual-machines"],"refs":[{"source":"pa2q","locator":"Page 2, Exercise 2-8"},{"source":"pa2a","locator":"Page 5, Exercise 2-8 solution"}],"technicalNote":"The question intentionally leaves the provider policy unspecified. There is no single numerical CPU/GPU split to calculate; explain valid mechanisms and policy dependence."},{"id":"PA2-09","assignment":"PA2","number":9,"title":"Shared memory versus messages","topic":"IPC","group":"Processes","difficulty":"Comparison","question":"What is Interprocess Communication (IPC)? Compare Shared Memory and Message Passing in terms of how they work, speed, and synchronization. Give an example of each.","hints":["Ask where the bytes are stored and who transfers them.","Synchronization is required in both designs, although the mechanisms differ."],"checklist":["Define IPC as communication/coordination among processes.","Describe mapped shared memory with direct accesses after setup.","Explain explicit synchronization for shared mutable data.","Describe send/receive communication through a channel.","Compare typical overhead without an absolute speed claim.","Give one concrete example of each."],"answer":"IPC comprises mechanisms through which processes exchange information and coordinate their work. With shared memory, the OS establishes a region mapped into multiple processes; they then exchange data through reads and writes to that region. It can avoid repeated copying and system calls for each data item, but processes must synchronize access, for example with a mutex or semaphore. A producer and consumer using a shared buffer is an example. With message passing, processes send and receive data through channels such as pipes, sockets or message queues. The channel preserves separation and may provide blocking behavior and ordering guarantees, but message transfer can add copying and kernel/network overhead. A client sending requests to a server through a socket is an example.","explanation":["Compare mechanisms first: shared locations versus explicit message exchange.","Explain speed in terms of copying, kernel entry and workload, not slogans.","Explain the shared-buffer race that requires synchronization.","Message primitives can help synchronization, but the protocol still needs rules for ordering, coordination and errors."],"mistakes":["Saying shared memory requires no OS involvement at setup.","Saying message passing eliminates every synchronization problem.","Saying shared memory is always faster for every message size and implementation.","Using “database” without explaining the communication mechanism."],"relatedLessons":["shared-memory","message-passing"],"refs":[{"source":"pa2q","locator":"Page 2, Exercise 2-9"},{"source":"pa2a","locator":"Page 5, Exercise 2-9 solution"}]},{"id":"PA2-10","assignment":"PA2","number":10,"title":"Choose an OS structure","topic":"OS structures","group":"Services","difficulty":"Evaluation","question":"For each of the following scenarios, identify which operating system structure (monolithic, layered, microkernel, modular, or hybrid) would be most suitable, and justify your choice.\\na) A safety-critical medical device (e.g., a pacemaker controller) where system reliability and fault isolation are the top priority, even at the cost of performance.\\nb) A general-purpose desktop OS that needs high performance for everyday tasks (file access, networking, process management) and wants to add new features over time without redesigning the whole system.\\nc) An educational OS built for teaching students how operating systems work, where each layer’s functionality should be clearly separated and easy to understand.\\nd) A modern commercial OS (e.g., Windows or macOS) that needs the performance of tightly integrated core services but also the flexibility to load or unload drivers and extensions without rebooting.","hints":["Match each scenario’s dominant requirement to a structure’s trade-off.","For the desktop case, consider loadable modules; for fault isolation, consider separated services."],"checklist":["a: microkernel with user-space service isolation and communication cost.","b: modular kernel for performance plus extensibility.","c: layered structure for clear responsibilities.","d: hybrid for a combination of integrated core services and flexibility.","Explain reasons; architectural labels are not safety or performance guarantees."],"answer":"a) Microkernel: keep the privileged core small and place other services in separate user-space processes, improving fault isolation at the cost of communication overhead. A real medical product also needs real-time guarantees, validation and applicable safety engineering. b) Modular: retain closely integrated kernel services for performance while adding supported drivers/filesystems through loadable modules. c) Layered: separate responsibilities into well-defined levels that use lower-level services, making the design easier to teach and reason about. d) Hybrid: combine tightly integrated performance-critical services with selected modular and microkernel-inspired organization, matching the practical mixture commonly associated with Windows NT and macOS XNU.","explanation":["Identify the priority in each scenario before naming a design.","Microkernel separation limits the reach of some service failures, but cannot prove system safety by itself.","A modular kernel is often monolithic in privilege organization; modularity and monolithic design are not mutually exclusive.","Layering favors conceptual separation; excessive crossing of layers can cost performance.","Hybrid is a broad design label, so justify it using the actual required mixture instead of treating it as an automatically superior architecture."],"mistakes":["Claiming a microkernel guarantees a pacemaker is safe.","Treating modular and monolithic as always mutually exclusive.","Choosing structures without explaining the scenario’s requirements.","Assuming every driver can always be unloaded safely without rebooting."],"relatedLessons":["os-structures"],"refs":[{"source":"pa2q","locator":"Page 2, Exercise 2-10"},{"source":"pa2a","locator":"Page 6, Exercise 2-10 solution"}],"technicalNote":"The source answer’s expected matches are microkernel, modular, layered and hybrid. Dynamic loading/unloading depends on the actual component and OS; architecture labels alone do not guarantee it."},{"id":"PA3-01","assignment":"PA3","number":1,"title":"Program versus process","topic":"Process basics","group":"Processes","difficulty":"Foundation","question":"What is the difference between a program and a process? Why is a program described as passive while a process is active?","hints":["Compare an executable file with one running instance of it.","Name state that can differ between two instances of the same executable."],"checklist":["Program is stored instructions, a passive entity.","Process is an execution instance with state/resources.","Mention PC, registers, memory and/or stack.","Explain multiple processes may execute the same program."],"answer":"A program is a stored set of instructions, typically an executable file. It is passive because storing it does not itself carry out computation. A process is an instance of a program in execution, with an execution state and resources such as an address space, stack, register values, program counter and open files. It is active because the OS manages its ongoing execution, even when it is temporarily Ready or Waiting rather than currently on the CPU. Two processes can run the same executable while having different input, memory contents and progress.","explanation":["Contrast code as a stored description with one execution of that code.","Use two editor windows/processes as an example of independent instances.","Identify the process state that lets the OS pause and resume each instance.","“Active entity” describes an execution lifetime; it does not mean constantly Running."],"mistakes":["Saying every process must be on the CPU at all times.","Assuming one executable can have only one process.","Treating the program counter as part of the executable file’s changing contents."],"relatedLessons":["storage-hierarchy","program-process"],"refs":[{"source":"pa3q","locator":"Page 1, Exercise 3-1"},{"source":"pa3a","locator":"Page 1, Exercise 3-1 solution"}]},{"id":"PA3-02","assignment":"PA3","number":2,"title":"Explain every process transition","topic":"Process states","group":"Processes","difficulty":"Sequence","question":"Consider the following sequence:\\nNew → Ready → Running → Waiting → Ready → Running → Terminated\\nExplain what could have caused each transition.","hints":["Ready means able to run; Waiting means unable to proceed until an event.","Map each arrow to one event: admission, dispatch, blocking, completion, dispatch, exit."],"checklist":["New→Ready: admission after creation.","Ready→Running: dispatch onto CPU.","Running→Waiting: blocking for I/O/event.","Waiting→Ready: event completion.","Ready→Running: later dispatch.","Running→Terminated: exit/completion."],"answer":"New → Ready: the OS finishes creating/admitting the process so it can compete for CPU time. Ready → Running: the scheduler chooses it and the dispatcher gives it the CPU. Running → Waiting: it requests blocking I/O or must wait for another event. Waiting → Ready: that I/O/event completes, making it eligible to run. Ready → Running: it is selected and dispatched again. Running → Terminated: it finishes or otherwise exits, ending its execution.","explanation":["Read each arrow independently and name the event that changes eligibility or CPU ownership.","A process waiting only for CPU belongs to Ready, not Waiting.","I/O completion normally moves a blocked process to Ready; it does not guarantee immediate CPU ownership.","Termination ends execution; retained exit-status bookkeeping is a separate implementation detail."],"mistakes":["Saying Waiting→Ready means the scheduler selected the process.","Skipping Ready and claiming every completed I/O immediately runs the process.","Treating New as an ordinary running program."],"relatedLessons":["process-states","scheduling-queues","scheduler-dispatcher"],"refs":[{"source":"pa3q","locator":"Page 1, Exercise 3-2"},{"source":"pa3a","locator":"Page 1, Exercise 3-2 solution"}],"technicalNote":"Formatting adjustment: the extracted PDF splits “Waiting” and “Terminated” with internal spaces. Those words are normalized here; the question and state sequence are otherwise preserved."},{"id":"PA3-03","assignment":"PA3","number":3,"title":"Does an interrupt mean Waiting?","topic":"Process states","group":"Processes","difficulty":"Application","question":"A running process is interrupted before it finishes. Does this necessarily mean that it enters the Waiting state?","hints":["Did the task lose the CPU, or become unable to proceed?","A timer expiry and a blocking read have different consequences."],"checklist":["Answer no.","Preemption can move Running→Ready.","Waiting requires an event dependency such as pending I/O.","An interrupt can be handled and the same process resumed."],"answer":"No. If a timer interrupt leads the scheduler to preempt the process, it becomes Ready because it can continue as soon as it receives CPU time again. Waiting means it cannot proceed until a particular event occurs, such as its requested I/O completing. A hardware interrupt can also be handled and return to the same process without a scheduling-state transition. The fact that execution was interrupted is therefore insufficient to conclude that the process is Waiting.","explanation":["Ask whether the process remains eligible to execute.","If yes but another task receives the CPU, choose Ready.","If it depends on an unfinished I/O/event, choose Waiting.","Distinguish handler execution from a process context switch: not every interrupt causes the latter."],"mistakes":["Calling any delay a Waiting state.","Assuming all interrupts block the interrupted process.","Assuming every interrupt must select a different process."],"relatedLessons":["interrupts","process-states","scheduling-queues"],"refs":[{"source":"pa3q","locator":"Page 1, Exercise 3-3"},{"source":"pa3a","locator":"Page 2, Exercise 3-3 solution"}]},{"id":"PA3-04","assignment":"PA3","number":4,"title":"What context must be preserved?","topic":"Context switching","group":"Processes","difficulty":"Application","question":"What information would be lost if the OS switched processes without saving the current process’s context?","hints":["Think of the information needed to resume the next instruction correctly.","Distinguish CPU registers from memory that remains stored while another process runs."],"checklist":["Program counter / resume location.","CPU general registers and temporary results.","Stack pointer and status/flags as relevant.","Association with PCB/saved execution context.","Explain incorrect resumption if state is overwritten."],"answer":"The OS could lose the process’s resume location (program counter) and live CPU register values, including temporary results, the stack pointer and relevant status flags. The next process would overwrite the shared CPU’s registers, so restoring the old process without its saved context could continue at the wrong instruction or use incorrect values. The OS associates saved execution state with the process, conventionally through its PCB and related kernel data, so it can later restore the context and resume correctly. The process’s entire memory is not normally copied on every context switch.","explanation":["The CPU has one active register context per execution unit, while many processes may need to resume later.","Before overwriting that context, record enough state to reconstruct it.","When returning to a process, restore its own context rather than leaving another process’s values active.","PCB is the conceptual bookkeeping structure; exact storage arrangements vary."],"mistakes":["Mentioning only the program’s filename.","Claiming the OS must copy all RAM for every context switch.","Saying a process always restarts from the beginning after preemption."],"relatedLessons":["pcb","context-switch"],"refs":[{"source":"pa3q","locator":"Page 1, Exercise 3-4"},{"source":"pa3a","locator":"Page 2, Exercise 3-4 solution"}]},{"id":"PA3-05","assignment":"PA3","number":5,"title":"Why switching is overhead","topic":"Context switching","group":"Processes","difficulty":"Reasoning","question":"Why is context-switching time considered overhead?","hints":["Compare instructions that perform application work with instructions that manage which application runs.","Necessary work can still be overhead relative to the application’s useful work."],"checklist":["Saving/restoring context consumes CPU time.","That time does not directly advance either application’s computation.","Other costs such as scheduler/cache effects may occur.","Switching remains necessary for multitasking and responsiveness."],"answer":"During a context switch, the CPU saves one task’s state, performs scheduling/bookkeeping and restores another task’s state. This consumes time without directly advancing either task’s requested computation, so it is overhead relative to useful application execution. Cache or translation-state effects can add further costs. The overhead is not pointless: switching enables responsiveness and sharing, but excessively frequent switches can reduce the CPU time available for application work.","explanation":["Define the unit of useful work: the application’s computation or I/O-service task.","Identify save/restore operations as management work required to alternate tasks.","Explain the trade-off rather than suggesting switching should never happen.","A shorter time slice can improve responsiveness while increasing the fraction spent switching."],"mistakes":["Claiming the CPU performs no instructions during a switch.","Calling overhead an error or a completely useless operation.","Assuming context switching always doubles execution time."],"relatedLessons":["context-switch","scheduler-dispatcher"],"refs":[{"source":"pa3q","locator":"Page 1, Exercise 3-5"},{"source":"pa3a","locator":"Page 2, Exercise 3-5 solution"}]},{"id":"PA3-06","assignment":"PA3","number":6,"title":"Why PIDs are necessary","topic":"Process identity","group":"Processes","difficulty":"Reasoning","question":"Why does the operating system need a PID if it already knows the program being executed?","hints":["Imagine running the same executable three times.","How would a signal target only one of those instances?"],"checklist":["One program can have multiple simultaneous instances.","Each instance has its own state/resources.","PID identifies the instance for OS operations.","Give a management example such as signals or waiting."],"answer":"The program name identifies code, but it does not uniquely identify an execution instance. Several processes can run the same executable with different memory, input and progress. A PID lets the OS and tools refer to one process for operations such as inspecting its state, sending a signal, recording its parent or collecting its exit status. For example, two sleep processes have the same program name but different PIDs, so one can be stopped without selecting the other.","explanation":["Separate executable identity from process-instance identity.","Use a concrete case with repeated execution of one program.","Explain how OS bookkeeping and commands require a per-instance identifier.","PIDs may be reused after a process lifecycle ends; they are not permanent identities for all time."],"mistakes":["Claiming all processes from one program share a PID.","Treating PID as a filename.","Claiming a PID can never be reused."],"relatedLessons":["pcb"],"refs":[{"source":"pa3q","locator":"Page 1, Exercise 3-6"},{"source":"pa3a","locator":"Page 2, Exercise 3-6 solution"}]},{"id":"PA3-07","assignment":"PA3","number":7,"title":"Parent and child resources","topic":"Process creation","group":"Processes","difficulty":"Application","question":"During process creation, must the parent and child always share all their resources?","hints":["The parent-child relationship describes creation, not a requirement to share everything.","Separate duplicated private memory from shared kernel-backed objects."],"checklist":["Answer no.","Resource-sharing policy may be all, some or none in the general model.","Separate address-space behavior from other resource behavior.","Give a concrete fork example without saying private writes always remain shared."],"answer":"No. In the general process-creation model, parent and child may share all, some or no resources according to the OS and creation mechanism. Address-space contents and other resources must be considered separately. For ordinary Linux fork(), the child gets a separate virtual address space initially containing the same private data, commonly implemented using copy-on-write. It also inherits file descriptors that refer to the same underlying open-file descriptions. A later exec() replaces the child’s program image. Thus, neither “everything shared” nor “nothing related” describes every parent-child pair.","explanation":["Start with the general policy alternatives requested by the course.","Do not confuse an initial copy with permanent sharing of private writable memory.","Use inherited open files to illustrate selective sharing.","Explain that exec changes the executing program while preserving the process identity rather than creating another child."],"mistakes":["Saying child writes always modify the parent’s private variables.","Assuming inherited file descriptors imply a shared complete address space.","Treating fork and exec as the same operation."],"relatedLessons":["fork-exec-wait"],"refs":[{"source":"pa3q","locator":"Page 1, Exercise 3-7"},{"source":"pa3a","locator":"Page 3, Exercise 3-7 solution"},{"source":"linux-fork","locator":"DESCRIPTION: separate memory spaces and inherited file descriptors"}],"technicalNote":"The official answer presents broad OS-design alternatives. Linux fork has specific semantics: distinct memory spaces, with selected shared underlying objects such as open-file descriptions."},{"id":"PA3-08","assignment":"PA3","number":8,"title":"Parent and child execution","topic":"Process creation","group":"Processes","difficulty":"Reasoning","question":"Must a parent process stop executing whenever it creates a child process?","hints":["Creation alone is not a wait operation.","Concurrency means overlapping progress; it does not require two cores."],"checklist":["Answer no.","Parent and child can execute concurrently.","Parent may explicitly wait for a child.","Distinguish concurrency from simultaneous multicore execution."],"answer":"No. Creating a child does not automatically require the parent to stop until the child completes. Parent and child can both be eligible to run and make progress concurrently. On a single core their execution is interleaved; on multiple cores they may also run in parallel. If the program needs the child’s result before continuing, the parent can use a wait operation and block until the relevant event. The behavior depends on the program and process-creation mechanism, not simply on the existence of a parent-child relationship.","explanation":["Identify two separate operations: create a process, then optionally wait for it.","After ordinary fork, both execution paths can proceed, with different return values distinguishing them.","A blocking wait changes the parent’s eligibility until a child event occurs.","Do not infer a fixed order in which parent and child run after creation."],"mistakes":["Saying the child must always run first.","Saying the parent is automatically suspended until every child ends.","Saying concurrent execution is impossible on one core."],"relatedLessons":["fork-exec-wait"],"refs":[{"source":"pa3q","locator":"Page 2, Exercise 3-8"},{"source":"pa3a","locator":"Page 3, Exercise 3-8 solution"}]},{"id":"PA3-09","assignment":"PA3","number":9,"title":"Normal process termination","topic":"Process termination","group":"Processes","difficulty":"Sequence","question":"A process executes its final instruction. What happens next?","hints":["Think about an exit status and reclaiming resources, not just the CPU stopping.","Some bookkeeping can survive after execution has ended."],"checklist":["Normal completion invokes termination through exit/runtime.","OS stops scheduling the process.","Most resources are released.","Exit status can be made available to the parent.","Retained status/zombie bookkeeping may remain until reaped."],"answer":"On normal completion, the program/runtime requests process termination, commonly through exit(); returning from main normally leads to this path. The OS stops scheduling the process, releases most resources and records termination information that a parent can collect. In the usual Unix wait model, a small record containing the PID and exit status remains until a parent or reaper collects it; this is a zombie, not a still-running process. Completion therefore includes cleanup and reporting, not merely reaching the end of a sequence of instructions.","explanation":["Treat “final instruction” as the question’s normal-completion shorthand.","Identify the controlled OS termination path.","Separate releasing memory/open resources from retaining minimal termination metadata.","Explain that wait/reaping finishes the parent’s collection of that metadata."],"mistakes":["Saying the CPU executes whatever memory happens to follow the executable.","Claiming a zombie still executes instructions.","Claiming all information about the child disappears immediately in every case."],"relatedLessons":["process-termination"],"refs":[{"source":"pa3q","locator":"Page 2, Exercise 3-9"},{"source":"pa3a","locator":"Page 3, Exercise 3-9 solution"},{"source":"linux-wait","locator":"DESCRIPTION and NOTES: termination status and zombie reaping"}],"technicalNote":"The key simplifies cleanup. On Unix-like systems, exit status may remain until wait/reaping. Reaching an arbitrary final machine instruction is not itself a universal hardware rule for normal termination."},{"id":"PA3-10","assignment":"PA3","number":10,"title":"When a parent ends a child","topic":"Process termination","group":"Processes","difficulty":"Application","question":"Under what circumstances might a parent terminate one of its child processes?","hints":["Think about resource limits, canceled work and an application’s cleanup policy.","Be careful about claiming that a child always dies when its parent exits."],"checklist":["Child exceeds allocated resources or allowed execution time.","Task is canceled, obsolete or no longer needed.","Parent/application may request cleanup during shutdown.","Termination is subject to OS permissions/mechanisms.","Parent exit does not universally imply automatic child termination."],"answer":"A parent may request a child’s termination if it exceeds an allowed resource budget, hangs or exceeds a time limit, or performs a task that is no longer needed. An application may also explicitly stop its worker children during shutdown. The OS supplies mechanisms such as signals and enforces applicable permissions; a graceful termination request may allow cleanup, while stronger termination may be needed if the child does not respond. Some systems or policies arrange cascading termination, but a parent exiting does not universally kill every child.","explanation":["Give the two core course reasons: excess resources and an obsolete task.","Add an explicit shutdown policy rather than assuming parenthood enforces automatic cleanup.","Distinguish requesting termination from directly manipulating the child’s execution.","On ordinary Unix systems, children can survive parent exit and be reparented, unless a separate mechanism or policy terminates them."],"mistakes":["Saying children always terminate automatically when the parent exits.","Treating any termination signal as guaranteed immediate graceful cleanup.","Assuming a parent can bypass all OS access controls."],"relatedLessons":["process-termination"],"refs":[{"source":"pa3q","locator":"Page 2, Exercise 3-10"},{"source":"pa3a","locator":"Page 3, Exercise 3-10 solution"},{"source":"linux-fork","locator":"DESCRIPTION: parent-death signal setting is reset"},{"source":"linux-wait","locator":"NOTES: adoption by init or a subreaper"}],"technicalNote":"The key says termination can relate to parent exit but does not establish a universal rule. Linux generally reparents surviving children; parent-death signals or application policies are separate mechanisms."},{"id":"PA3-11","assignment":"PA3","number":11,"title":"Connect exit() and wait()","topic":"Process termination","group":"Processes","difficulty":"Integration","question":"What is the relationship between exit() and wait()?","hints":["They are called by different participants in the usual parent-child example.","If the child has already terminated, waiting can collect its status without first waiting in real time."],"checklist":["Child/process calls exit to end execution with status.","Parent calls wait to collect a child’s termination information.","wait returns child PID and writes encoded status through its argument.","wait can block if no waitable child has terminated.","Reaping removes retained termination bookkeeping."],"answer":"exit(status) is used by a process to end its execution and report termination status. In the usual parent-child pattern, the child exits and the parent calls wait(&status) to collect the result. A successful wait returns the PID of the collected child and stores encoded status information through the argument. If no relevant child has yet terminated, wait normally blocks; if a terminated child is already waitable, it can return immediately. Collecting a terminated child’s status reaps its remaining bookkeeping. wait does not itself tell the child to terminate.","explanation":["Assign roles explicitly: the terminating child exits, and the observing parent waits.","Separate the function return value (PID) from the output status argument.","Use status-inspection macros to distinguish normal exit from signal termination before interpreting an exit code.","Consider both orderings: parent waits first, or child exits first; the relationship still works."],"mistakes":["Saying wait terminates the child.","Saying exit is called only by the parent.","Treating the wait return value as the child’s exit code.","Saying wait always delays even if the child has already finished."],"relatedLessons":["fork-exec-wait","process-termination"],"refs":[{"source":"pa3q","locator":"Page 2, Exercise 3-11"},{"source":"pa3a","locator":"Page 4, Exercise 3-11 solution"},{"source":"linux-wait","locator":"DESCRIPTION: wait()/waitpid() and status macros"}],"technicalNote":"The status written by wait is encoded information, not simply the raw exit code. In C, test WIFEXITED(status) before using WEXITSTATUS(status)."},{"id":"PA3-12","assignment":"PA3","number":12,"title":"Why processes cooperate","topic":"IPC","group":"Processes","difficulty":"Reasoning","question":"Why would processes cooperate instead of operating completely independently?","hints":["Use information sharing, speedup, modularity and convenience.","Give one example and identify why communication is needed."],"checklist":["Information sharing.","Possible computation speedup through divided work.","Modularity through separate components.","Convenience through related activities.","IPC and coordination are needed; speedup is not guaranteed."],"answer":"Processes cooperate to share information, divide work, improve modularity and support convenient workflows. For example, a browser interface, a download service and a renderer may perform different parts of one user task and exchange requests or results. Splitting computation among processes can improve speed when work can run in parallel and coordination costs do not dominate. Separate processes can also isolate responsibilities and failures. Cooperation requires IPC, such as shared memory or messages, and appropriate synchronization so shared results remain consistent.","explanation":["Explain each motivation rather than memorizing four words.","Information sharing concerns exchanged data; modularity concerns the organization of responsibilities.","Computation speedup depends on parallelizable work, available hardware and communication overhead.","Connect cooperation to a concrete IPC mechanism and the need to coordinate ordering."],"mistakes":["Saying more cooperating processes always make a computation faster.","Assuming separate address spaces prevent all communication.","Ignoring synchronization when multiple processes modify shared data."],"relatedLessons":["shared-memory","message-passing"],"refs":[{"source":"pa3q","locator":"Page 2, Exercise 3-12"},{"source":"pa3a","locator":"Page 4, Exercise 3-12 solution"}]}]'),I7={title:"OS - Practice Assignment 01 - Process Concepts (Alternate Set).pdf",note:"This separately labelled PA1 process set contains the same 12 process questions as PA3. It is retained as a source reference, excluded from the 28 unique core questions, and not counted twice.",url:"https://drive.google.com/file/d/1kHB9HMfRMSQkVc8NVt1ZN1nIy3cmnhmc/view"},L7=["Original PA wording is preserved after PDF formatting normalization: wrapped lines are joined, page footers removed, extraction soft-hyphen control characters removed, and the split words “W aiting” and “T erminated” repaired. Subpart labels are preserved.","The 28 answers are independently written teaching/reference answers checked against the supplied university solution documents. They are not official marking schemes or promises of exam marks. Checklists support student self-assessment; free text is not automatically graded.","PA2-03 distinguishes the mode of an initiating request/instruction from its kernel handling. PA2-04 corrects the misleading implication that a CPU cannot return to user work while I/O proceeds, and explains that interrupt return is not always a return to user mode.","PA2-05 qualifies architecture-dependent “trap” terminology and system-call entry paths. PA2-06 uses the course’s conceptual interrupt policies without claiming all real kernels permit nesting.","PA2-07 uses the source’s size interpretation of limit, yielding [4000,5200), and explicitly separates physical addresses from logical offsets.","PA2-08 does not invent a numerical allocation policy or equate CPU and GPU cores. PA2-10 preserves the key’s preferred matches while avoiding safety guarantees or treating modular/monolithic designs as mutually exclusive.","PA3-03 notes that interrupt handling need not switch processes. PA3-07 distinguishes generic creation-policy options from actual Linux fork behavior. PA3-09/10/11 clarify reaping, encoded status and the absence of universal parent-exit cascading termination.","Question PDF page locations are grounded in the extracted page footers and exercise boundaries. The alternate PA1 set duplicates PA3 and does not expand the official core count."],Dh={sources:U7,questions:B7,alternative:I7,auditNotes:L7},H7=[{id:"lab1",title:"OS - Lab 01 - Computer Architecture - Manual.docx",url:"https://drive.google.com/file/d/1_I8P0n-3zgYeplYpEYXv5zjR9KkKklJq/view"},{id:"lab1cheat",title:"OS - Lab 01 - Linux Commands Cheat Sheet.pdf",url:"https://drive.google.com/file/d/11KX-wS0b-ffFuBx8iMQEPpsxh9G-iXit/view"},{id:"lab2",title:"OS - Lab 02 - OS Services & Protection - Manual.docx",url:"https://drive.google.com/file/d/1A6Te-8rh4lh1Pk5PVlPrVQKTOYWZT08G/view"},{id:"lab2slides",title:"OS - Lab 02 - OS Services & Protection - Theoretical Slides.pdf",url:"https://drive.google.com/file/d/1_zjQ-FHzlQDrqae5rCFW-3OXrVg2RHAG/view"},{id:"lab3",title:"OS - Lab 03 - Processes - Manual.docx",url:"https://drive.google.com/file/d/17EzxMk293AsKAZT3puI3JbfgSaEEWINk/view"},{id:"lab3slides",title:"OS - Lab 03 - Processes - Practical Slides.pptx",url:"https://drive.google.com/file/d/1vtz8UgItbDqexhQmyj8TXWnqUAGuzf2E/view"},{id:"bash-status",title:"GNU Bash Reference Manual — Exit Status",url:"https://www.gnu.org/s/bash/manual/html_node/Exit-Status.html"},{id:"lsblk-man",title:"util-linux lsblk(8) — topology option",url:"https://www.man7.org/linux/man-pages/man8/lsblk.8.html"},{id:"capabilities-man",title:"Linux capabilities(7) — CAP_DAC_OVERRIDE",url:"https://www.man7.org/linux/man-pages/man7/capabilities.7.html"}],G7=JSON.parse(`[{"id":"lab1","title":"Lab 1 · Read the machine","topic":"Computer architecture and Linux inspection","group":"Foundations","intro":"A CPU, memory and devices become easier to understand when you can inspect their properties. This lab turns Linux output into evidence: identify what each field measures, calculate topology, and explain why virtual files do not behave like ordinary disk files. All outputs below are illustrative snapshots, not measurements from your computer.","objectives":["Navigate the filesystem and find command documentation.","Explain /proc, /sys and /dev without treating them as ordinary folders of stored documents.","Interpret logical CPUs, sockets, cores, hardware threads and cache levels.","Convert page and cache-line sizes between bytes, KiB and powers of two.","Distinguish available memory from completely unused memory.","Choose the correct tools for block, PCI and USB devices."],"sections":[{"title":"1. Prepare a reproducible session","explanation":"Create a dedicated folder, then record the session so your actual VM results are available for the report. The && operator executes its right-hand command only if the left-hand command succeeds. A tilde expands to your home directory. script creates a terminal recording; exit ends the recording shell. OS NEXUS does not create a real submission log.","commands":[{"command":"mkdir -p ~/oslabs/lab01 && cd ~/oslabs/lab01","output":"[no output on success]","explanation":"mkdir -p creates missing parents; cd enters the folder."},{"command":"script -q ~/oslabs/lab01/session.log","output":"[recording shell starts]","explanation":"-q reduces start/end messages. Keep this shell open until the lab is finished."},{"command":"exit","output":"[recording shell exits]","explanation":"Run at the end, after completing and recording the observations."}]},{"title":"2. Navigate and ask Linux for help","explanation":"pwd prints the current path. ls lists directory entries; -l adds details, -a includes hidden names and -h makes sizes easier to read when combined with a detailed listing. cd changes directory in the current shell. man displays a manual, while apropos searches manual descriptions. In man, Space scrolls, /word searches, n repeats the search and q quits.","commands":[{"command":"pwd","output":"/home/student/oslabs/lab01","explanation":"An absolute path begins at /. It is not the same as the home abbreviation ~."},{"command":"ls -la","output":"drwxr-xr-x 2 student student 4096 .\\ndrwxr-xr-x 3 student student 4096 ..\\n-rw-r--r-- 1 student student  120 session.log","explanation":"This shortened example includes . (current) and .. (parent). File sizes and dates vary."},{"command":"cd ..\\npwd","output":"/home/student/oslabs","explanation":"cd / goes to root, cd ~ to home and cd - to the previous directory."},{"command":"man hier","output":"[manual describing the filesystem hierarchy]","explanation":"Use man ls or ls --help for a specific command; apropos cpu searches documentation."},{"command":"history","output":"1  pwd\\n2  ls -la","explanation":"In Bash, !! repeats the previous command and !42 refers to history entry 42. Inspect a command before rerunning it."}]},{"title":"3. Decode the filesystem hierarchy","explanation":"/bin contains essential executable commands (often reached through a link to /usr/bin on modern systems). /etc holds system configuration. /var holds variable data such as logs. /proc presents kernel and process information through virtual files. /sys exposes kernel objects, devices and their attributes. /dev contains device nodes that provide interfaces to devices. A directory name tells you its role; it does not guarantee that its entries are ordinary files stored on disk.","commands":[{"command":"ls -l /","output":"bin  dev  etc  home  proc  sys  var  ...","explanation":"Illustrative abbreviated root listing. Use man hier to explain the requested directories in your own words."}]},{"title":"4. Investigate the live /proc interface","explanation":"The kernel generates many /proc values when they are read. Consequently, a reported size of zero for /proc/cpuinfo does not mean that reading it produces no data. /proc/uptime contains uptime in seconds and accumulated idle time across CPUs; idle time can exceed uptime on a multicore machine. Repeated reads can change even though you did not edit the file.","commands":[{"command":"ls -l /proc/cpuinfo","output":"-r--r--r-- 1 root root 0 ... /proc/cpuinfo","explanation":"The zero is reported file size, not proof of an empty read."},{"command":"du -sh /proc/cpuinfo","output":"0\\t/proc/cpuinfo","explanation":"The virtual file does not consume ordinary file data blocks."},{"command":"cat /proc/uptime\\ncat /proc/uptime","output":"120.00 420.00\\n121.00 423.50","explanation":"Two illustrative observations. The second number is aggregated idle CPU time, not a date or free-memory value."}]},{"title":"5. Count sockets, cores and logical CPUs","explanation":"A socket is a physical CPU package; a core is an execution engine inside a package; a hardware thread is a logical CPU exposed by a core. For the uniform topology in this lab, logical CPUs = sockets × cores per socket × threads per core. A VM reports virtual topology, which need not reveal the host topology. The Architecture field describes the CPU instruction-set architecture. Little endian means the least significant byte of a multibyte value is stored at the lowest addressed byte.","commands":[{"command":"lscpu","output":"Architecture:          x86_64\\nByte Order:            Little Endian\\nCPU(s):                4\\nThread(s) per core:    2\\nCore(s) per socket:    2\\nSocket(s):             1\\nL1d cache:             64 KiB (2 instances)\\nL1i cache:             64 KiB (2 instances)\\nL2 cache:              512 KiB (2 instances)\\nL3 cache:              4 MiB (1 instance)","explanation":"Example: 1 × 2 × 2 = 4 logical CPUs. Cache display conventions can differ by lscpu version; read instance counts instead of assuming a total is per core."},{"command":"grep -c ^processor /proc/cpuinfo","output":"4","explanation":"-c counts matching lines and ^ anchors the pattern at the start. In this example the logical CPU count matches lscpu."},{"command":"grep -m1 'model name' /proc/cpuinfo","output":"model name : Example virtual x86_64 CPU","explanation":"-m1 stops after the first matching line. Use your real model name in the report."}]},{"title":"6. Understand cache lines and pages","explanation":"Small L1 caches provide fast access close to each core; larger L2/L3 caches trade some latency for capacity and reduce slow accesses to RAM. L1d stores data and L1i stores instructions. A cache line is a transfer/coherence granularity for caches. A memory page is a virtual-memory management granularity. They solve different problems. In the lab example, 4096 bytes = 4 KiB = 2^12 bytes and 64 bytes = 0.0625 KiB = 2^6 bytes. One 4096-byte page contains 64 lines of 64 bytes. These values are common examples, not universal hardware constants.","commands":[{"command":"getconf -a | grep -E 'PAGESIZE|LEVEL1_DCACHE_SIZE|LEVEL1_DCACHE_LINESIZE|LEVEL2_CACHE_SIZE|LEVEL3_CACHE_SIZE'","output":"PAGESIZE                        4096\\nLEVEL1_DCACHE_SIZE               32768\\nLEVEL1_DCACHE_LINESIZE           64\\nLEVEL2_CACHE_SIZE                262144\\nLEVEL3_CACHE_SIZE                4194304","explanation":"getconf -a prints constants, | passes the output to grep, and -E enables alternatives in the pattern. Values describe this illustrative system."}]},{"title":"7. Read memory without confusing free and available","explanation":"free is memory that is currently unused. Linux also uses otherwise idle RAM for buffers and caches, improving file access. available estimates how much memory can be used by new applications without swapping, including reclaimable cache. It may therefore be much larger than free. Fields and accounting formulas vary across versions; do not add every displayed field as though they were disjoint.","commands":[{"command":"free -h","output":"               total   used   free   shared   buff/cache   available\\nMem:           7.8Gi  2.1Gi  0.8Gi   0.1Gi        4.9Gi       5.3Gi\\nSwap:          2.0Gi     0B  2.0Gi","explanation":"Illustrative memory summary. A small free value alone does not prove memory exhaustion."},{"command":"head -5 /proc/meminfo","output":"MemTotal:        8178892 kB\\nMemFree:          838860 kB\\nMemAvailable:    5557452 kB\\nBuffers:          102400 kB\\nCached:          4900000 kB","explanation":"The kernel exposes memory counters. head -5 selects only the first five lines."}]},{"title":"8. Inspect disks, PCI and USB devices","explanation":"lsblk shows block devices such as disks and their partitions. The tree shows containment, not a process family. A mount point indicates where a filesystem appears in the directory hierarchy. lsblk -t shows block-device topology, including sector and I/O properties. Correction to Lab 1 Part C: its description of lsblk -t as a PCI listing is incorrect; lspci | head -15 is the PCI command. The cheat sheet identifies the same discrepancy.","commands":[{"command":"lsblk","output":"NAME   SIZE TYPE MOUNTPOINTS\\nsda     32G disk\\nsda1   512M part /boot/efi\\nsda2  31.5G part /","explanation":"One virtual disk contains two partitions in this example."},{"command":"lsblk -t","output":"NAME  ALIGNMENT MIN-IO OPT-IO PHY-SEC LOG-SEC ROTA\\nsda           0    512      0     512     512    1","explanation":"Block-device topology, not PCI devices. Actual columns depend on tool version."},{"command":"lspci | head -15","output":"00:00.0 Host bridge: Example virtual host bridge\\n00:02.0 VGA compatible controller: Example virtual graphics","explanation":"A corrected supplementary command for the stated PCI-inspection purpose."},{"command":"lsusb","output":"Bus 001 Device 001: ID 1d6b:0002 Linux Foundation 2.0 root hub","explanation":"A VM may expose only a small set of virtual USB devices."},{"command":"cat /proc/devices | head -20","output":"Character devices:\\n  1 mem\\n  4 tty\\n  5 /dev/tty\\n...","explanation":"Lists registered device classes and major numbers; it is not the same inventory as lsblk."}]}],"misconceptions":["A zero reported size under /proc does not imply that the file supplies no data.","Logical CPU count is not necessarily physical core count, especially in a VM.","A 64-byte cache line is not a 4096-byte page.","Low free RAM alone does not mean the machine has no usable memory.","lsblk -t does not list PCI devices."],"refs":[{"source":"lab1","locator":"Parts A–C and report tables"},{"source":"lab1cheat","locator":"Pages 1–2"},{"source":"lsblk-man","locator":"Options: -t, --topology"}],"quizIds":["GEN-31","GEN-32"]},{"id":"lab2","title":"Lab 2 · Follow the kernel boundary","topic":"System calls, streams and file permissions","group":"Services","intro":"A command can perform ordinary calculations in user mode while relying on the kernel for protected operations. This lab makes that boundary visible using system-call traces, output redirection and permission checks. Outputs are illustrative; system-call counts, library paths and file permissions must be observed on your own VM.","objectives":["Distinguish a system call from a library dependency.","Read strace summaries without assuming a fixed call count.","Route stdout and stderr independently and capture the correct exit status.","Convert Unix permission bits between symbolic and octal notation.","Explain why root identity is different from CPU kernel mode.","Connect protected file operations to dual-mode execution."],"sections":[{"title":"1. Start and record","explanation":"Use a separate folder and keep the recording shell running while you make observations. Empty output usually means the command succeeded silently; verify its effect if you are unsure.","commands":[{"command":"mkdir lab2\\ncd lab2\\nscript -q session.log","output":"[folder created; recording starts]","explanation":"mkdir without -p reports an error if lab2 already exists. cd enters the folder. Finish the recording with exit."}]},{"title":"2. Count system calls with strace","explanation":"strace observes the boundary where a traced process asks the kernel to perform operations. With -c, it aggregates calls into a summary rather than displaying every event. Startup and library loading can require calls before the visible command does its main work. A count near 100 in the manual is an example, not a required answer. Compare your measured total instead of trying to force a particular count.","commands":[{"command":"strace -c ls","output":"session.log\\n% time  seconds  usecs/call  calls  errors  syscall\\n  ...       ...         ...     12       0  openat\\n  ...       ...         ...      4       0  getdents64\\n100.00    0.0004         ...     96       5  total","explanation":"A shortened illustrative summary. ls writes its ordinary listing to stdout; strace writes tracing diagnostics to stderr. A syscall-level error need not make the whole program fail."},{"command":"strace -c pwd","output":"/home/student/lab2\\n...\\n100.00  ...  ...  60  ...  total","explanation":"The report asks for your observed total for pwd. The illustrative 60 is not a target."}]},{"title":"3. Inspect dynamic libraries with ldd","explanation":"A shared library is reusable user-space code loaded by programs. ldd reports dynamic shared-object dependencies; it does not count system calls and a library function is not automatically a system call. A library function may do computation entirely in user mode or eventually invoke a kernel service. Use the trusted lab binaries for this exercise.","commands":[{"command":"ldd /bin/ls","output":"linux-vdso.so.1 (...)\\nlibc.so.6 => /lib/x86_64-linux-gnu/libc.so.6 (...)\\n/lib64/ld-linux-x86-64.so.2 (...)","explanation":"Shortened example; dependencies and addresses depend on the executable and system."},{"command":"ldd /bin/cat","output":"libc.so.6 => /lib/x86_64-linux-gnu/libc.so.6 (...)","explanation":"The report asks for one actual .so dependency, not the address shown in parentheses."}]},{"title":"4. Redirect normal results and errors separately","explanation":"Processes normally inherit descriptor 0 for standard input, 1 for standard output and 2 for standard error. The shell opens the redirection target before starting the command. > redirects stdout and normally truncates an existing target; 2> redirects stderr. Redirecting stdout does not automatically redirect errors.","commands":[{"command":"ls > out.txt\\ncat out.txt","output":"out.txt\\nsession.log","explanation":"The ls listing goes into out.txt; cat then displays it. out.txt can appear in the listing because redirection created it first."},{"command":"ls /nothing 2> err.txt\\ncat err.txt","output":"ls: cannot access '/nothing': No such file or directory","explanation":"The failed ls diagnostic was captured in err.txt. The successful cat is a separate command."}]},{"title":"5. Read the exit status immediately","explanation":"Bash $? represents the status of the most recently completed command. Zero indicates success; nonzero indicates failure or another command-specific outcome. Correction to manual Step 10: after a successful cat err.txt, echo $? normally prints 0, not the earlier ls status. To inspect the failed ls, run echo $? immediately after ls, or save the status before running cat. The report version correctly places echo $? immediately after ls /abc.","commands":[{"command":"ls /nothing 2> err.txt\\necho $?","output":"2","explanation":"Illustrative GNU ls failure status. The key distinction is nonzero, and that no intervening command has replaced it."},{"command":"ls /nothing 2> err.txt\\ncat err.txt\\necho $?","output":"ls: cannot access '/nothing': No such file or directory\\n0","explanation":"The final zero belongs to successful cat. It does not retroactively make ls successful."},{"command":"ls /nothing 2> err.txt\\nstatus=$?\\ncat err.txt\\necho \\"$status\\"","output":"ls: cannot access '/nothing': No such file or directory\\n2","explanation":"Save a status before another command overwrites the special parameter."}]},{"title":"6. Use a pipe to connect commands","explanation":"A pipe connects the standard output of one command to the standard input of the next. It does not normally include stderr. head -5 keeps up to five lines, not necessarily five files if the input contains a header. In this ls example each output line is a name.","commands":[{"command":"ls /etc | head -5","output":"adduser.conf\\nalternatives\\napparmor\\napt\\nbash.bashrc","explanation":"Five illustrative names from a sorted listing. The real names depend on the VM."},{"command":"ls /etc | head -3","output":"adduser.conf\\nalternatives\\napparmor","explanation":"The report asks for three names. | is a pipe; && instead makes execution conditional on success."}]},{"title":"7. Translate permission bits","explanation":"Read the nine permission positions as owner, group and others. r contributes 4, w contributes 2 and x contributes 1 within each group. Therefore rw-r----- is 640 and rw------- is 600. A leading - in ls -l describes a regular file and is separate from the nine permission bits. For directories, x means search/traversal rather than running the directory.","commands":[{"command":"ls -l /etc/shadow","output":"-rw-r----- 1 root shadow ... /etc/shadow","explanation":"This illustrative 640 file allows owner read/write and group read; others have no permission. Actual permissions can differ."},{"command":"echo hi > note.txt\\nchmod 600 note.txt\\nls -l note.txt","output":"-rw------- 1 student student 3 ... note.txt","explanation":"600 gives the owner read/write and gives group and others no access. It does not grant execute permission."}]},{"title":"8. Observe denial, then restore access","explanation":"Assume the ordinary unprivileged lab user owns myfile.txt and no ACL grants extra access. chmod 000 removes all owner/group/other permission bits; a normal read is denied even to that owner. The owner can still change the file permissions back. This is ordinary discretionary access control, not an absolute prohibition against a process with relevant privileges such as CAP_DAC_OVERRIDE.","commands":[{"command":"echo hello > myfile.txt\\nchmod 000 myfile.txt\\ncat myfile.txt","output":"cat: myfile.txt: Permission denied","explanation":"The kernel checks credentials and permissions when the read is requested."},{"command":"chmod 640 myfile.txt\\nls -l myfile.txt\\ncat myfile.txt","output":"-rw-r----- 1 student student 6 ... myfile.txt\\nhello","explanation":"Restoring owner read permission makes the file readable again for its owner."}]},{"title":"9. Separate root identity from CPU privilege mode","explanation":"sudo, when policy permits and authentication succeeds, runs a command as another user, commonly root. A root-owned user-space program still executes ordinary instructions in user mode; it enters kernel mode through controlled transitions for kernel services. The kernel evaluates its more privileged credentials. Do not equate the root account with arbitrary execution inside the kernel.","commands":[{"command":"cat /etc/shadow","output":"cat: /etc/shadow: Permission denied","explanation":"Typical ordinary-user result because password-hash data is protected."},{"command":"sudo cat /etc/shadow","output":"[illustrative: access granted; sensitive contents omitted]","explanation":"The manual demonstrates credential-based authorization. OS NEXUS never reads or displays real password data."}]},{"title":"10. Connect the lab to the lecture model","explanation":"Opening a file reaches the kernel via a system call; arithmetic on an already loaded integer may run entirely in user mode. A system-call number identifies a kernel service through the system-call interface. A later hardware interrupt is a separate asynchronous event, identified through the interrupt mechanism. A mode transition does not necessarily switch to another process. Buffering holds data in transit, caching retains data for reuse and spooling queues work such as print jobs. The accompanying theoretical slides connect these distinctions to booting, base/limit protection, virtual machines and OS structures; use the linked Services lessons and PA2 for those complete explanations.","commands":[{"command":"exit","output":"[session recording ends]","explanation":"End the recording only after completing the report observations."}]}],"misconceptions":["strace counts kernel requests; ldd lists shared-library dependencies. They answer different questions.","echo $? refers to the immediately previous command, so an intervening successful cat changes the answer.","> redirects stdout; it does not also redirect stderr.","root is a user identity, while kernel mode is a CPU privilege level.","chmod 000 denies ordinary permission-based access but is not a guarantee against all privileged processes.","A system call can return to the same process; a mode switch is not automatically a process context switch."],"refs":[{"source":"lab2","locator":"Steps 1–21; Report Q1–Q7"},{"source":"lab2slides","locator":"Kernel vs. System Utilities; Dual Mode Operation; Exercises 2-1–2-10"},{"source":"bash-status","locator":"Exit status of the last command"},{"source":"capabilities-man","locator":"CAP_DAC_OVERRIDE"}],"quizIds":["GEN-33","GEN-34"]},{"id":"lab3","title":"Lab 3 · Control a process","topic":"Linux process identity, states and signals","group":"Processes","intro":"Start one sleep process and follow its identity through waiting, suspension, resumption and termination. Keep the same Bash session so the saved PID remains available. The outputs below use a deterministic example PID of 4821 and parent PID 4700; your real VM values will differ. The practical Lab 3 scope observes S and T, explains R and D, and explains Z without adding the Lab 4 zombie experiment.","objectives":["Distinguish a program, a process, a shell job number and a PID.","Interpret ps identity, resource and CPU-time fields.","Read selected kernel process information through /proc.","Explain R, S, D, T and Z without confusing waiting and stopping.","Send STOP, CONT and TERM and predict the observed state.","Explain why wait collects child status and why KILL differs from TERM."],"sections":[{"title":"1. Prepare and inspect snapshots","explanation":"The lab uses Bash and one long-lived sleep job. Create a folder, start session recording and read the manual sections before experimenting. ps displays a snapshot, not a continuously updating monitor. Plain ps normally selects processes associated with your user and terminal; ps aux provides a broad view.","commands":[{"command":"mkdir -p ~/oslabs/lab03 && cd ~/oslabs/lab03\\nscript -q session.log","output":"[recording starts]","explanation":"Keep the same terminal open; finish with exit after cleanup."},{"command":"man ps\\nman 7 signal","output":"[manual pages]","explanation":"In man ps, search /PROCESS STATE. Read signal names and verify numbers on your VM."},{"command":"ps aux | head -5","output":"USER   PID %CPU %MEM  VSZ  RSS TTY   STAT START TIME COMMAND\\nroot     1  0.0  0.1  ...  ... ?     Ss   09:00 0:01 /sbin/init\\nstudent 4700 0.0 0.1  ...  ... pts/0 Ss  09:05 0:00 bash\\nstudent 4701 0.0 0.0  ...  ... pts/0 R+  09:06 0:00 ps aux\\nstudent 4702 0.0 0.0  ...  ... pts/0 S+  09:06 0:00 head -5","explanation":"Five lines include the header: at most four process rows here."}]},{"title":"2. Start a process and preserve its PID","explanation":"sleep is a program; sleep 3600 & starts a process that waits for a timer. & runs it in the background so the shell can return a prompt. $! expands to the PID of the latest background job; save it immediately before another background command changes it. PID=$! has no spaces around =. A PID is system process identity within the relevant PID namespace, while [1] is a job number local to this shell.","commands":[{"command":"sleep 3600 &\\nPID=$!\\necho \\"PID is $PID\\"","output":"[1] 4821\\nPID is 4821","explanation":"This is an example process ID, not a value to copy into your VM."},{"command":"ps -p \\"$PID\\" -o pid,ppid,stat,comm","output":"  PID  PPID STAT COMMAND\\n 4821  4700 S    sleep","explanation":"PPID identifies the parent, usually the shell. sleep normally waits in S; it is still a live process."}]},{"title":"3. Interpret CPU time and memory","explanation":"USER is the process owner, TIME is accumulated CPU execution time and COMMAND shows the command with arguments. TIME is not elapsed time since launch: a one-hour sleep can use almost no CPU time. VSZ is virtual address-space size; RSS is resident memory currently in RAM. Both are shown in KiB in this ps layout. Virtual mappings need not all occupy RAM at once, so VSZ and RSS need not match.","commands":[{"command":"ps -p \\"$PID\\" -o user,pid,vsz,rss,time,args","output":"USER      PID  VSZ  RSS     TIME COMMAND\\nstudent  4821 2908 1792 00:00:00 sleep 3600","explanation":"The illustrative process reserves more virtual memory than its resident memory. Zero rounded CPU time does not mean it has never existed."}]},{"title":"4. Read kernel process information","explanation":"/proc/PID/status exposes selected identity, state and memory fields. The entries are kernel-provided views; they are not the complete internal PCB. The fd directory contains symbolic links for open file descriptors. Normally 0 is stdin, 1 stdout and 2 stderr; redirection can make them refer to files or pipes rather than the terminal.","commands":[{"command":"grep -E '^(Name|State|Pid|PPid|VmSize|VmRSS):' /proc/$PID/status","output":"Name:\\tsleep\\nState:\\tS (sleeping)\\nPid:\\t4821\\nPPid:\\t4700\\nVmSize:\\t2908 kB\\nVmRSS:\\t1792 kB","explanation":"^ anchors the pattern; | means OR inside this regular expression, not a shell pipe because it is quoted."},{"command":"ls -l /proc/$PID/fd","output":"0 -> /dev/pts/0\\n1 -> /dev/pts/0\\n2 -> /dev/pts/0","explanation":"Simplified entries showing inherited standard channels. More descriptors may exist."}]},{"title":"5. Distinguish Linux states from shell job labels","explanation":"R means running or runnable; it combines the lecture model’s Running and Ready. S is interruptible sleep awaiting an event; D is an uninterruptible wait, often associated with I/O. T is stopped and can be resumed. Z means the process has exited but status remains to be collected. A shell job described as Running may contain a process in S: the job label means it is not stopped or completed, not that it currently owns the CPU.","commands":[{"command":"jobs -l","output":"[1]+ 4821 Running    sleep 3600 &","explanation":"The shell tracks its own jobs, not every process on the system."},{"command":"ps -p \\"$PID\\" -o pid,stat,comm","output":"  PID STAT COMMAND\\n 4821 S    sleep","explanation":"No contradiction: the job is continuing, while the process waits for its timer."}]},{"title":"6. Move between foreground and background","explanation":"Foreground/background describe the relationship to the shell’s terminal, not a separate Linux process state. fg %sleep brings the single matching job forward. Ctrl-Z normally sends the terminal stop signal SIGTSTP to the foreground process group; after the job stops, the shell returns a prompt. bg resumes it in the background. Keep one sleep job so %sleep is unambiguous; otherwise use the job number.","commands":[{"command":"fg %sleep\\n[press Ctrl-Z]","output":"sleep 3600\\n[1]+ Stopped    sleep 3600","explanation":"The process is suspended, not destroyed. Ctrl-Z is a keyboard action, not text to type as a shell command."},{"command":"jobs -l\\nbg %sleep\\njobs -l","output":"[1]+ 4821 Stopped    sleep 3600\\n[1]+ sleep 3600 &\\n[1]+ 4821 Running    sleep 3600 &","explanation":"Resumption preserves the PID and ordinarily returns sleep to S."}]},{"title":"7. Send STOP and CONT deliberately","explanation":"kill sends a signal; its name does not imply that every signal terminates. SIGSTOP suspends execution and cannot be caught or ignored. SIGCONT resumes a stopped process. The resumed process becomes eligible to proceed, but sleep normally returns to its timer wait and is observed as S. CONT does not create a new process or guarantee it remains in R.","commands":[{"command":"kill -STOP \\"$PID\\"\\nps -p \\"$PID\\" -o pid,stat,comm","output":"  PID STAT COMMAND\\n 4821 T    sleep","explanation":"The same PID is now stopped."},{"command":"kill -CONT \\"$PID\\"\\nps -p \\"$PID\\" -o pid,stat,comm","output":"  PID STAT COMMAND\\n 4821 S    sleep","explanation":"It resumes and normally waits again. Tiny intermediate states may be missed by a snapshot."}]},{"title":"8. Request termination, collect status and verify","explanation":"SIGTERM requests termination and can be handled or ignored by a program; ordinary sleep normally exits. SIGKILL cannot be caught or ignored and prevents user-space cleanup handlers. Neither is a command to erase a program’s executable file. wait waits for a child and collects status; a nonzero status following signal termination is expected. Shells may reap children automatically, so do not rely on observing a persistent Z state here.","commands":[{"command":"kill -TERM \\"$PID\\"\\nwait \\"$PID\\" 2>/dev/null\\nps -p \\"$PID\\"","output":"  PID TTY          TIME CMD","explanation":"The header with no process row shows that this PID is absent from the snapshot. The saved PID variable still contains the old number."},{"command":"kill -KILL \\"$PID\\"","output":"bash: kill: (4821) - No such process","explanation":"After termination and collection, a further signal to that absent PID fails. In a real system PIDs can later be reused, so always verify the target."}]},{"title":"9. Explain the lifecycle and troubleshoot","explanation":"The observed path is S → T → S → termination, not New → Running → Terminated on every command. A zombie has already exited; an orphan has lost its parent while it may still be alive and is normally adopted on Linux. If $PID is empty, restart the planned process and immediately save $!. If /proc/PID is missing, verify the process still exists. If fg leaves no prompt, use the planned Ctrl-Z action. End any remaining test jobs before ending the recording.","commands":[{"command":"exit","output":"[session recording ends]","explanation":"Submit observations from your own VM; illustrative examples are for interpretation and practice."}]}],"misconceptions":["A process in S is alive; sleep is the program name, not a command that suspends an unrelated process.","jobs Running does not imply Linux state R or current CPU ownership.","TIME is CPU time, not wall-clock lifetime.","STOP preserves the process; CONT preserves its PID.","TERM permits a handler; KILL does not.","A zombie has already exited, whereas an orphan has lost its original parent.","/proc exposes selected PCB-related information, not an exact dump of every internal PCB field."],"refs":[{"source":"lab3","locator":"Parts A–B; Report Q1–Q5"},{"source":"lab3slides","locator":"Slides 3–33"}],"quizIds":["GEN-35","GEN-36"]}]`),yg={sources:H7,labs:G7},_7=JSON.parse('[{"id":"GEN-01","kind":"mcq","group":"Foundations","topic":"OS purpose","prompt":"Which statement best describes the OS from the system perspective?","options":["It translates every high-level programming language into machine code.","It allocates and controls hardware resources shared by programs.","It is only the graphical desktop that users can see.","It replaces the CPU instruction set with a programming language."],"correct":1,"explanation":"The OS manages resources such as CPU time, memory and devices and controls their use. A desktop interface is one way to interact with this wider system.","misconception":"Do not define the entire OS solely by one interface or utility.","refs":[{"source":"services","locator":"OS job: User view and System view"}]},{"id":"GEN-02","kind":"mcq","group":"Foundations","topic":"Computer architecture","prompt":"In the basic von Neumann model, which resource is shared by instructions and data?","options":["The same main memory/address space and communication path.","One separate instruction memory and one separate data memory.","A dedicated interrupt handler for each arithmetic operation.","Only the keyboard input buffer."],"correct":0,"explanation":"The basic von Neumann organization stores instructions and data in a common memory system. Separate instruction and data paths are characteristic of the basic Harvard model. Real machines may combine design ideas.","misconception":"A split L1 instruction/data cache alone does not mean the entire computer uses a pure Harvard memory model.","refs":[{"source":"intro","locator":"Slides 36–39: Instruction cycle and von Neumann architecture"}]},{"id":"GEN-03","kind":"mcq","group":"Foundations","topic":"Instruction cycle","prompt":"What happens in the decode stage of the simplified fetch–decode–execute cycle?","options":["The OS always switches to another process.","The result is automatically written to a disk.","The CPU determines the operation and operands specified by the instruction.","The firmware reloads the kernel."],"correct":2,"explanation":"Fetch retrieves an instruction; decode interprets its encoded operation; execute performs the required operation. Data transfer or result storage depends on the instruction.","misconception":"Fetching an instruction and interpreting it are different steps.","refs":[{"source":"intro","locator":"Slide 36: Fetch, decode, execute"}]},{"id":"GEN-04","kind":"mcq","group":"Services","topic":"User and kernel mode","prompt":"Which operation, as phrased, requires privileged kernel handling in the course model?","options":["Adding two ordinary integers already held in an application’s registers.","Formatting a string inside an application buffer.","Choosing a word’s font in an already running editor.","Handling a device’s hardware interrupt in its ISR."],"correct":3,"explanation":"The interrupt handler runs with the privileges needed to handle the hardware event. Ordinary computations can execute in user mode; related I/O may separately require kernel services.","misconception":"A user-facing activity can contain user-mode work and separate kernel operations. Classify the specified operation.","refs":[{"source":"lab2slides","locator":"Exercise 2-3: User Mode or Kernel Mode"}]},{"id":"GEN-05","kind":"mcq","group":"Services","topic":"System calls and interrupts","prompt":"A process calls an OS service; later a device signals completion. Which distinction is correct?","options":["The call is synchronous with the calling instruction; device completion is asynchronous to the interrupted instruction stream.","Both events are necessarily generated by the same instruction.","The hardware interrupt is selected by the system-call number.","The system call is always an error and the interrupt is always a successful operation."],"correct":0,"explanation":"The request originates from the executing program; the device can notify the CPU independently of that program’s current instruction. The system-call interface and interrupt-vector mechanism serve different roles.","misconception":"A system-call table and an interrupt-vector table are not interchangeable.","refs":[{"source":"lab2slides","locator":"Exercises 2-4 and 2-5"}]},{"id":"GEN-06","kind":"mcq","group":"Services","topic":"Memory protection","prompt":"Use the course convention: base = 6000 and limit = 800 bytes, with limit meaning the region length. Which physical address is the highest valid one?","options":["6800","6799","800","6001"],"correct":1,"explanation":"Valid physical addresses satisfy $6000 \\\\le a < 6000+800$. Therefore the last valid address is $$6000+800-1=6799.$$ Address 6800 is the first byte outside the permitted region.","misconception":"Do not include base + limit when limit is a size. This question states the convention explicitly.","refs":[{"source":"lab2slides","locator":"Exercise 2-7: Base & Limit Registers"}]},{"id":"GEN-07","kind":"mcq","group":"Processes","topic":"Process state transitions","prompt":"A process in the five-state teaching model completes the I/O event it was waiting for. What is its immediate next state before a CPU is assigned?","options":["Terminated","Running","New","Ready"],"correct":3,"explanation":"I/O completion makes the process eligible for CPU service, so it enters Ready. The scheduler/dispatcher must subsequently select it to run.","misconception":"Waiting → Running skips the ready/scheduling step in the stated model.","refs":[{"source":"processes","locator":"Slides 11–12: Process states and transitions"}]},{"id":"GEN-08","kind":"mcq","group":"Processes","topic":"fork and exec","prompt":"A process successfully executes an exec-family call. What is the defining effect?","options":["A second process is created and both execute the original program.","The current process waits for every process on the computer.","The current process image is replaced by a new program; its PID is retained.","The current process always becomes a zombie immediately."],"correct":2,"explanation":"exec replaces the calling process’s program image. fork creates a new process. A program often uses fork followed by exec, but those are distinct operations.","misconception":"Do not count exec itself as creation of another PID.","refs":[{"source":"processes","locator":"Slide 27: UNIX examples"}]},{"id":"GEN-09","kind":"mcq","group":"Processes","topic":"Interprocess communication","prompt":"After the OS establishes a shared-memory region, what responsibility remains essential for cooperating processes that update the same data?","options":["Coordinate access so that conflicting updates do not race.","Copy every byte through a new system call on every load.","Give both processes the same PID.","Disable all file-system services permanently."],"correct":0,"explanation":"Shared memory allows direct access to common data, but sharing does not make multi-step updates atomic. Coordination is needed when operations conflict.","misconception":"A shared address range is a communication mechanism, not an automatic synchronization solution.","refs":[{"source":"processes","locator":"Slides 32–36: IPC models and shared memory"}]},{"id":"GEN-10","kind":"mcq","group":"Threads","topic":"Thread resources","prompt":"Which set normally belongs separately to each thread in one process?","options":["The executable’s code and all global variables.","The process’s address space and open-file table only.","The physical CPU and its entire cache hierarchy.","Program counter, register state and stack."],"correct":3,"explanation":"Each thread needs its own execution position, registers and call stack. Threads in a process typically share code, data and resources such as open files.","misconception":"Sharing an address space does not make every thread execute with one shared stack.","refs":[{"source":"threads","locator":"Slides 5–10: Thread concept and resources"}]},{"id":"GEN-11","kind":"mcq","group":"Threads","topic":"Amdahl’s Law","prompt":"Assume 25% of a program is serial, 75% is perfectly parallel, two equal cores are used, and there is no additional overhead. What speedup does Amdahl’s Law predict?","options":["2.00×","1.60×","4.00×","0.625×"],"correct":1,"explanation":"Ideal speedup: $$\\\\mathrm{Speedup}=\\\\frac{1}{0.25+\\\\frac{0.75}{2}}=\\\\frac{1}{0.625}=1.6$$ The serial quarter stays unchanged; only the parallel three quarters are divided between two cores.","misconception":"Dividing all the work by two incorrectly parallelizes the serial quarter.","refs":[{"source":"threads","locator":"Slide 17: Amdahl’s Law"}]},{"id":"GEN-12","kind":"mcq","group":"Scheduling","topic":"FCFS waiting time","prompt":"Three processes arrive at time 0 in queue order P1, P2, P3, with CPU bursts 6, 2 and 4. Under non-preemptive FCFS, with no I/O or switch cost, what is the total waiting time across all three?","options":["12 time units","6 time units","14 time units","18 time units"],"correct":2,"explanation":"FCFS runs P1 from 0–6, P2 from 6–8, and P3 from 8–12. All arrive at zero. Total waiting time is $$WT_{\\\\mathrm{total}}=0+6+8=14.$$ The average is $14/3$, but the question asks for the total.","misconception":"Burst-time sum and waiting-time sum measure different quantities.","refs":[{"source":"scheduling","locator":"FCFS example; slides 14–16: Waiting time"}]},{"id":"GEN-13","kind":"mcq","group":"Scheduling","topic":"Shortest job first","prompt":"All three processes arrive at time 0: P1 has burst 6, P2 burst 2 and P3 burst 4. Under non-preemptive SJF with no I/O or switch cost, what is the execution order?","options":["P2 → P3 → P1","P1 → P2 → P3","P3 → P2 → P1","P1 → P3 → P2"],"correct":0,"explanation":"At each dispatch, choose the available process with the shortest burst: 2, then 4, then 6. Equal arrivals and unequal burst lengths remove tie ambiguity.","misconception":"SJF chooses among arrived ready work; it does not normally wait for an unknown future job.","refs":[{"source":"scheduling","locator":"Shortest Job First examples"}]},{"id":"GEN-14","kind":"mcq","group":"Scheduling","topic":"Round Robin response time","prompt":"P1 and P2 arrive at 0 in that queue order with bursts 5 and 3. Round Robin uses quantum 2 and zero switch overhead. Define response time as first CPU start minus arrival. What is P2’s response time?","options":["0","3","5","2"],"correct":3,"explanation":"P1 first runs from 0 to 2; P2 starts at 2. $$RT_2=ST_2-AT_2=2-0=2.$$ Only the first start matters for response time."

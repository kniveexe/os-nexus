,"misconception":"Response time is not completion time or total waiting accumulated over every turn.","refs":[{"source":"scheduling","locator":"Slides 14–16 and Round Robin section"}]},{"id":"GEN-15","kind":"mcq","group":"Concurrency","topic":"Race conditions","prompt":"counter starts at 5. Producer reads 5 and computes 6 in a private register. Consumer reads 5 and computes 4. Producer writes 6; consumer then writes 4. What is the final counter value in this specified interleaving?","options":["5","4","6","11"],"correct":1,"explanation":"The final shared-memory write is the consumer’s stale calculation, 4. A correctly synchronized increment plus decrement should leave 5; this order loses the producer’s update.","misconception":"A source-language ++ or -- is not guaranteed to be an indivisible shared update.","refs":[{"source":"concurrency","locator":"Slides 21–24: Counter race interleavings"}]},{"id":"GEN-16","kind":"mcq","group":"Concurrency","topic":"Counting semaphores","prompt":"A counting semaphore represents two identical available resources and starts at 2. Two processes each successfully perform one atomic wait operation and hold their resources. With no signal yet, what happens to a third process’s wait?","options":["It creates a third resource automatically.","It deletes both current holders.","It cannot acquire a resource until one becomes available.","It must immediately enter the protected operation."],"correct":2,"explanation":"Both permits are held, so the available-resource count is zero. The third acquisition must wait; whether it spins or sleeps depends on the semaphore implementation.","misconception":"A counting semaphore enforces a resource count; it is not a request to manufacture resources.","refs":[{"source":"concurrency","locator":"Slides 38–39: Semaphore wait, signal and resource counts"}]},{"id":"GEN-17","kind":"truefalse","group":"Foundations","topic":"Virtual files","prompt":"A /proc/cpuinfo file that reports size 0 can still return CPU information when read.","options":["True","False"],"correct":0,"explanation":"Many /proc contents are produced by the kernel at read time, so their reported file size need not describe the readable data.","misconception":"A procfs virtual file need not behave like a disk-backed text file.","refs":[{"source":"lab1","locator":"Part A2; Checkpoint 1"}]},{"id":"GEN-18","kind":"truefalse","group":"Services","topic":"CPU privilege mode","prompt":"Running an ordinary arithmetic instruction as the root user means that instruction necessarily executes in CPU kernel mode.","options":["True","False"],"correct":1,"explanation":"Root is an account/credential identity. A root user-space program still executes ordinary instructions in user mode and enters the kernel through controlled mechanisms for services.","misconception":"User identities and CPU privilege levels are different dimensions.","refs":[{"source":"lab2","locator":"Steps 13–14; conceptual clarification of sudo"}]},{"id":"GEN-19","kind":"truefalse","group":"Services","topic":"Mode and context switches","prompt":"Every system call necessarily causes the CPU to switch to a different process.","options":["True","False"],"correct":1,"explanation":"The CPU can enter the kernel to service the current process and return to that same process. Blocking or scheduling decisions may cause a switch, but a system call alone does not require one.","misconception":"A mode transition is not automatically a process context switch.","refs":[{"source":"services","locator":"Dual Mode Operation and System Call Implementation"}]},{"id":"GEN-20","kind":"truefalse","group":"Processes","topic":"Zombie processes","prompt":"A zombie process has already exited, but its parent has not yet collected the retained exit status.","options":["True","False"],"correct":0,"explanation":"The executable work is finished. A small kernel record remains for status collection; the zombie is not a sleeping process that can be resumed with CONT.","misconception":"Exited does not always mean all accounting information has already been collected.","refs":[{"source":"lab3slides","locator":"Slide 24: Linux process states"}]},{"id":"GEN-21","kind":"truefalse","group":"Threads","topic":"Threading models","prompt":"In the classic many-to-one threading model, several user threads mapped to one kernel thread can execute simultaneously on several CPU cores.","options":["True","False"],"correct":1,"explanation":"Only one kernel-schedulable execution entity exists for those mapped user threads, so they cannot use multiple cores in parallel through that mapping.","misconception":"Many user threads do not imply many kernel threads.","refs":[{"source":"threads","locator":"Slide 22: Many-to-One"}]},{"id":"GEN-22","kind":"truefalse","group":"Scheduling","topic":"Round Robin quantum","prompt":"If Round Robin’s quantum is at least as large as every CPU burst in a fixed ready queue, and there are no further arrivals or I/O, its execution order becomes the queue’s FCFS order.","options":["True","False"],"correct":0,"explanation":"Every process completes its burst on its first turn, so no unfinished process is rotated back to the queue. The explicit assumptions remove later-arrival and I/O complications.","misconception":"A larger quantum does not make Round Robin become shortest-job-first.","refs":[{"source":"scheduling","locator":"Round Robin: q large implies FIFO/FCFS"}]},{"id":"GEN-23","kind":"truefalse","group":"Concurrency","topic":"Critical section requirements","prompt":"Mutual exclusion by itself proves that every waiting process will eventually enter its critical section.","options":["True","False"],"correct":1,"explanation":"Mutual exclusion prevents simultaneous conflicting entry. Progress and bounded waiting are separate requirements concerned with continuing to admit work and limiting postponement.","misconception":"Preventing overlap does not automatically prevent starvation.","refs":[{"source":"concurrency","locator":"Slide 27: Solution requirements"}]},{"id":"GEN-24","kind":"truefalse","group":"Concurrency","topic":"Deadlock and starvation","prompt":"A low-priority process may starve while higher-priority processes continue completing useful work.","options":["True","False"],"correct":0,"explanation":"Starvation is indefinite deprivation of a particular process; the whole system need not stop. A deadlocked set instead cannot advance because its members wait on dependencies within the set.","misconception":"Starvation does not require every process to be blocked.","refs":[{"source":"concurrency","locator":"Slides 41–44: Deadlock and starvation"}]},{"id":"GEN-25","kind":"scenario","group":"Foundations","topic":"Abstraction and arbitration","prompt":"A video-call application uses the same camera API on two different camera models. Separately, the OS decides which application may use the camera. Which pairing best describes these two roles?","options":["Both are only arithmetic operations.","The API hides hardware differences (abstraction); access decisions manage sharing (arbitration).","The API is arbitration; access decisions are only persistence.","Neither role belongs to an OS."],"correct":1,"explanation":"Abstraction presents a usable interface without requiring device-specific details. Arbitration determines how shared resources are allocated. The same practical service can need both.","misconception":"A feature may combine abstraction and arbitration rather than fitting only one label.","refs":[{"source":"intro","locator":"Slides 17–24: Abstraction and arbitration examples"}]},{"id":"GEN-26","kind":"scenario","group":"Services","topic":"Printing and interrupts","prompt":"A program initiates a print operation through a kernel service and then the CPU executes other work. Later, the printer controller raises an interrupt. Which explanation is correct?","options":["The printer must directly overwrite the application’s code to resume it.","The application chooses the ISR by changing its own PID.","The print system call must have been an asynchronous hardware interrupt.","The controller’s interrupt is a later event; an interrupt handler services it, and execution can resume according to OS scheduling."],"correct":3,"explanation":"The synchronous service request starts work; the device’s later asynchronous notification invokes interrupt handling. The interrupted process need not be the one that requested printing, and a return can restore the appropriate prior privilege context.","misconception":"Do not merge the system-call initiation and later device notification into one identical event.","refs":[{"source":"lab2slides","locator":"Exercise 2-4: Printing workflow"}]},{"id":"GEN-27","kind":"scenario","group":"Processes","topic":"Waiting and process completion","prompt":"A parent has one unfinished child and calls a blocking wait for it. The child later exits. Which description best fits this behavior?","options":["The parent waits for the child’s termination and can then obtain its exit status.","The parent’s wait starts another copy of the child program.","The child must become the parent’s thread and share its stack.","The parent must consume CPU continuously until the child exits."],"correct":0,"explanation":"A blocking wait can suspend the parent while the child runs; on completion, the parent can receive child status. Waiting does not require a busy loop or another child creation.","misconception":"Blocking in wait differs from repeatedly polling while occupying CPU time.","refs":[{"source":"processes","locator":"Slides 27–29: wait and exit"}]},{"id":"GEN-28","kind":"scenario","group":"Threads","topic":"Data and task parallelism","prompt":"A photo editor assigns four workers separate quarters of the same image, and each worker applies the same blur operation. Which description fits best?","options":["Task parallelism because each worker performs an unrelated operation.","No parallelism is possible because the image is one file.","Data parallelism because the same operation runs on separate data subsets.","Kernel-mode execution because the image has four quarters."],"correct":2,"explanation":"Data parallelism partitions input while applying the same operation. Task parallelism assigns different operations, such as reading, filtering and writing. Correct handling of dependencies at image boundaries is still needed.","misconception":"Splitting data among workers does not eliminate every dependency automatically.","refs":[{"source":"threads","locator":"Types of parallelism; multicore programming challenges"}]},{"id":"GEN-29","kind":"scenario","group":"Scheduling","topic":"Shortest remaining time","prompt":"P1 arrives at 0 with burst 8. P2 arrives at 1 with burst 3. Under SRT, with no I/O or overhead, what should happen at time 1?","options":["P1 must keep running because SRT is non-preemptive.","P1 is preempted because its remaining 7 is longer than P2’s 3.","P2 must wait until time 8 because it arrived later.","Both processes execute simultaneously on the stated single CPU."],"correct":1,"explanation":"SRT compares remaining work among ready processes. At time 1, P1 has used 1 of 8 units, leaving 7, so the newly arrived three-unit job has the shorter remaining time.","misconception":"Do not compare only P1’s original burst or apply FCFS rules to SRT.","refs":[{"source":"scheduling","locator":"Shortest Remaining Time (preemptive SJF)"}]},{"id":"GEN-30","kind":"scenario","group":"Concurrency","topic":"Deadlock","prompt":"Process A holds a board and waits for a pen held by B. Process B holds the pen and waits for the board held by A. Neither releases its held resource while waiting, and no outside action intervenes. What is this situation?","options":["Normal mutual exclusion with guaranteed progress.","Only one process doing slow I/O.","A correct counting-semaphore initialization.","Deadlock: the processes are waiting on each other and cannot proceed."],"correct":3,"explanation":"Each process holds what the other needs and waits without releasing it. Under the stated assumptions neither can advance. This is stronger than one process simply losing repeated scheduling opportunities.","misconception":"Being blocked temporarily is not necessarily deadlock; the circular dependency and no-release assumptions matter.","refs":[{"source":"concurrency","locator":"Slide 42: Board-and-pen deadlock example"}]},{"id":"GEN-31","kind":"lab","group":"Foundations","topic":"CPU topology","prompt":"An illustrative lscpu output shows:\\nSocket(s): 2\\nCore(s) per socket: 3\\nThread(s) per core: 2\\nFor this uniform topology, how many logical CPUs should CPU(s) show?","options":["3","6","12","24"],"correct":2,"explanation":"$$\\\\mathrm{Logical\\\\ CPUs}=2\\\\times3\\\\times2=12.$$ Physical cores total $2\\\\times3=6$. Hardware threads on a core share its execution resources.","misconception":"Do not stop at the physical-core count when asked for logical CPUs.","refs":[{"source":"lab1","locator":"Part B2: Topology arithmetic"}]},{"id":"GEN-32","kind":"lab","group":"Foundations","topic":"Memory interpretation","prompt":"An illustrative free -h line shows free = 0.8 GiB, buff/cache = 4.9 GiB and available = 5.3 GiB. Which conclusion is justified?","options":["Some cached memory can be reclaimed, so available can exceed completely unused free memory.","Only 0.8 GiB can ever be used by another application.","The displayed values prove that RAM is broken.","available must always equal free plus all buff/cache exactly."],"correct":0,"explanation":"available estimates memory usable by new workloads without swapping and can include reclaimable cached pages. It is not simply a promise that every cached byte is reclaimable.","misconception":"Do not infer exhaustion from free alone or assume all displayed categories are independent.","refs":[{"source":"lab1","locator":"Part C: free -h and memory checkpoint"}]},{"id":"GEN-33","kind":"lab","group":"Services","topic":"Unix permissions","prompt":"A regular file is displayed as:\\n-rw-r----- 1 student learners ... note.txt\\nIgnoring ACLs and special privileges, which statement matches its mode bits?","options":["Owner can read only; group can read/write; others can execute.","Owner, group and others can all read.","Owner can execute the file because it begins with -.","Owner can read/write; group can read; others have no permission."],"correct":3,"explanation":"After the file-type character, rw- is owner 6, r-- is group 4 and --- is others 0: mode 640.","misconception":"The first - indicates a regular file; it is not an execute permission.","refs":[{"source":"lab2","locator":"Steps 12 and 18–19: Permission groups"}]},{"id":"GEN-34","kind":"lab","group":"Services","topic":"Exit status","prompt":"In Bash, suppose ls fails with status 2, while cat successfully reads err.txt:\\nls /nothing 2> err.txt\\ncat err.txt\\necho $?\\nWhat does echo print?","options":["2, because $? permanently remembers the first error.","0, because the most recently completed command was successful cat.","1, because stderr was redirected.","The contents of err.txt, because $? is a filename."],"correct":1,"explanation":"The successful cat replaces the prior status. To inspect ls, echo $? immediately after ls or first save status=$?. This corrects the ordering error in the manual’s Step 10 example.","misconception":"The presence of an error message inside a file does not make cat fail when it reads that file successfully.","refs":[{"source":"lab2","locator":"Steps 8–10; corrected command-order explanation"}]},{"id":"GEN-35","kind":"lab","group":"Processes","topic":"Process signals","prompt":"After kill -STOP \\"$PID\\", ps shows:\\nPID  STAT COMMAND\\n4821 T    sleep\\nWhat is the best interpretation?","options":["The process is stopped and still exists with the same PID.","The executable sleep has been deleted from disk.","PID 4821 is necessarily a zombie.","The process is guaranteed to be consuming its entire CPU quantum."],"correct":0,"explanation":"T is the stopped state. SIGSTOP suspends execution without terminating the process; SIGCONT can resume it.","misconception":"A stopped process is neither a sleeping S process nor an exited Z process.","refs":[{"source":"lab3slides","locator":"Slide 25: Stop with a signal"}]},{"id":"GEN-36","kind":"lab","group":"Processes","topic":"Jobs and process states","prompt":"jobs -l reports \\"Running sleep 3600 &\\", while ps reports state S for the same PID. Which explanation is correct?","options":["One command must be corrupt because Running and S cannot coexist.","The process has exited but the shell is unaware forever.","The shell job is continuing, while the process is interruptibly sleeping for its timer.","The process is a zombie that is executing CPU instructions."],"correct":2,"explanation":"The shell’s job status distinguishes running/continuing work from stopped or completed work. Linux S describes a live process currently waiting for an event. The labels answer different questions.","misconception":"A shell job marked Running is not guaranteed to have Linux state R.","refs":[{"source":"lab3slides","locator":"Slides 20–24: Foreground/background, jobs and states"}]}]'),F7={questions:_7},V7=qh,cc=Dh,na=qh.lessons,ga=Dh.questions,mi=yg.labs,Zt=F7.questions,bg=[...new Map([...qh.sources,...Dh.sources,...yg.sources].map(n=>[n.id,n])).values()],_r=["Foundations","Services","Processes","Threads","Scheduling","Concurrency"],xg={Foundations:"The foundations",Services:"Inside the operating system",Processes:"Processes & communication",Threads:"Threads & parallelism",Scheduling:"CPU scheduling",Concurrency:"Concurrency & synchronization"},Y7={Foundations:"Architecture, abstraction & the instruction cycle",Services:"Protection, interrupts, services & structure",Processes:"States, context, lifecycle & IPC",Threads:"Shared resources, models & multicore execution",Scheduling:"Algorithms, timelines & performance metrics",Concurrency:"Race conditions, mutual exclusion & coordin
